<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Pattern Ladder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d3557">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a single phone-width column like a study card; Hornby's "Subject × Verb | Object" table slots drive the pattern visuals. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#18263b; --muted:#5b6778; --line:#d9dfe8;
  --accent:#1d4f91; --accent-ink:#ffffff; --accent-soft:#e3ecf8;
  --good:#1f7a4d; --good-soft:#dff3e8; --bad:#b3263e; --bad-soft:#fbe3e7; --warn:#a86200; --warn-soft:#fdf0db;
  --slot1:#e8eef9; --slot2:#eaf5ee; --slot3:#f8efe2; --slot4:#f3e9f6;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Roboto Mono", monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1622; --surface:#172131; --ink:#e7ecf3; --muted:#9aa7b8; --line:#2a3647;
  --accent:#7fb0f0; --accent-ink:#0f1622; --accent-soft:#1d2d45;
  --good:#5fd39a; --good-soft:#163326; --bad:#ff8fa3; --bad-soft:#3a1a22; --warn:#f3b45a; --warn-soft:#3a2a12;
  --slot1:#1f2c42; --slot2:#1b3127; --slot3:#352a1b; --slot4:#2f2236; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1622; --surface:#172131; --ink:#e7ecf3; --muted:#9aa7b8; --line:#2a3647;
  --accent:#7fb0f0; --accent-ink:#0f1622; --accent-soft:#1d2d45;
  --good:#5fd39a; --good-soft:#163326; --bad:#ff8fa3; --bad-soft:#3a1a22; --warn:#f3b45a; --warn-soft:#3a2a12;
  --slot1:#1f2c42; --slot2:#1b3127; --slot3:#352a1b; --slot4:#2f2236; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-size:1.15rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--f-body);font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.iconbtn:hover{background:var(--accent-soft)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav button{border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}

/* generic */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);width:100%;font-size:1rem}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}
.row > *{min-width:0}

/* today */
.today{background:var(--accent);color:var(--accent-ink);border:0}
.today h2{font-size:1.5rem}
.today .btn{background:var(--accent-ink);color:var(--accent)}
.today .btn.ghost{background:transparent;color:var(--accent-ink);border-color:var(--accent-ink)}
.today .muted{color:inherit;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:12px}
.stat{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;font-family:var(--f-display);font-weight:400}
.stat span{font-size:.75rem;opacity:.85}
.goalbar{height:8px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--accent-ink);border-radius:9px}

/* level path */
.level{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.level header{padding:14px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.level .badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:1.2rem;flex:none}
.level h3{font-size:1.1rem}
.level header p{margin:0;font-size:.85rem;color:var(--muted)}
.units{list-style:none;margin:0;padding:0}
.unit{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.units li:first-child .unit{border-top:0}
.unit:hover:not(:disabled){background:var(--accent-soft)}
.unit:disabled{opacity:.5;cursor:not-allowed}
.vp{font-family:var(--f-mono);font-size:.72rem;padding:3px 7px;border-radius:6px;background:var(--slot1);color:var(--ink);white-space:nowrap;flex:none;min-width:62px;text-align:center}
.unit .t{flex:1;min-width:0}
.unit .t b{display:block;font-weight:700}
.unit .t span{font-size:.82rem;color:var(--muted);font-family:var(--f-mono)}
.stars{display:flex;gap:1px;flex:none}
.stars svg{width:15px;height:15px}
.lock svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}

/* lesson */
.formula{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.slot{font-family:var(--f-mono);font-size:.85rem;padding:6px 10px;border-radius:8px;border:1px dashed var(--line)}
.slot:nth-child(4n+1){background:var(--slot1)}.slot:nth-child(4n+2){background:var(--slot2)}
.slot:nth-child(4n+3){background:var(--slot3)}.slot:nth-child(4n+4){background:var(--slot4)}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.exlist li{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--bg)}
.exlist li span{flex:1;min-width:0}
.say{border:0;background:none;padding:2px;border-radius:6px;color:var(--accent);flex:none}
.say svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.watch{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 10px 10px 0;padding:10px 12px}
.watch .bad{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--muted)}
.watch .good{font-weight:700;color:var(--good)}
.sign{font-family:var(--f-display);color:var(--warn);font-size:1.1rem}
.verbs{font-family:var(--f-mono);font-size:.82rem;line-height:1.7}

/* quiz */
.progress{height:8px;border-radius:9px;background:var(--line);overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtype{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.qtext{font-size:1.2rem;line-height:1.45;margin:6px 0 0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.answer{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1.05rem}
.answer.right{border-color:var(--good);background:var(--good-soft)}
.answer.wrong{border-color:var(--bad);background:var(--bad-soft)}
.build-line{min-height:58px;border-radius:12px;border:1.5px dashed var(--line);padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:var(--surface)}
.build-line.right{border-color:var(--good);border-style:solid;background:var(--good-soft)}
.build-line.wrong{border-color:var(--bad);border-style:solid;background:var(--bad-soft)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.word{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-size:1rem;box-shadow:0 2px 0 var(--line)}
.word:disabled{visibility:hidden}
.feedback{border-radius:12px;padding:12px 14px}
.feedback.right{background:var(--good-soft);color:var(--ink)}
.feedback.wrong{background:var(--bad-soft);color:var(--ink)}
.feedback b{display:block;margin-bottom:2px}
.feedback.right b{color:var(--good)}.feedback.wrong b{color:var(--bad)}
.dock{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-block:10px;background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* result */
.big{font-family:var(--f-display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.bigstars{display:flex;justify-content:center;gap:6px}
.bigstars svg{width:42px;height:42px}

/* reference table */
.ref{width:100%;border-collapse:collapse;font-size:.9rem}
.ref th,.ref td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
.ref th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
.ref td:first-child{font-family:var(--f-mono);white-space:nowrap}
.ref .fm{font-family:var(--f-mono);font-size:.8rem;display:block;color:var(--accent)}
.ref button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:5px 9px;font-weight:700;font-size:.8rem}
.tablewrap{overflow-x:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.toggle{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle p{margin:0}
.switch{width:50px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:23px}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .b{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.85rem}
.bars .track{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bars .track i{display:block;height:100%;border-radius:9px}
.bars .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:20;max-width:90vw}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.96);opacity:.6}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .18s ease-out}
</style>

<div class="top"><div class="in">
  <button class="iconbtn" id="backBtn" aria-label="Back" hidden><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="brand" id="brand">Pattern Ladder<small>Daily practice after A. S. Hornby</small></div>
  <span class="chip" id="streakChip" title="Days in a row"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 2c1 3 4 5 4 9a4 4 0 0 1-8 0c0-1.5.6-2.7 1.5-3.6C9.7 9.6 11 9 12 2zM7 14a5 5 0 0 0 10 0c0 3.9-2.2 8-5 8s-5-4.1-5-8z"/></svg><span id="streakNum">0</span></span>
</div></div>

<main class="wrap" id="view" aria-live="polite"></main>

<nav class="nav" aria-label="Main"><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Learn</button>
  <button data-tab="daily"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button data-tab="ref"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>Patterns</button>
  <button data-tab="me"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
</div></nav>

<script>
// Pattern Ladder — lesson data
// All example sentences and exercises are original, written to follow the
// patterns and usage described by A. S. Hornby (not copied from the book).
//
// Question types:
//   m = multiple choice   { t:'m', q, o:[options], a:indexOfCorrect, e:explanation }
//   f = fill in the blank { t:'f', q, a:[accepted answers], e }
// Build-the-sentence and Which-pattern questions are generated from "ex".

window.LEVELS = [
  { id: 1, name: "Foundation", tag: "Beginner", colour: "#2f9e6b",
    blurb: "The simplest sentence shapes: who does what, to whom, where." },
  { id: 2, name: "Elementary", tag: "Beginner+", colour: "#1f8ac0",
    blurb: "Verbs followed by -ing, to-infinitives, prepositions and objects." },
  { id: 3, name: "Intermediate", tag: "Intermediate", colour: "#7a5bd6",
    blurb: "Objects with infinitives, participles and that-clauses; tenses." },
  { id: 4, name: "Upper Intermediate", tag: "Intermediate+", colour: "#c0662a",
    blurb: "Question words, preparatory it and there, adjectives and adverbs." },
  { id: 5, name: "Advanced", tag: "Advanced", colour: "#c23b5a",
    blurb: "Expressing ideas: obligation, permission, wishes, conditions and more." }
];

window.UNITS = [
// ───────────────────────── LEVEL 1 ─────────────────────────
{ id: "u01", level: 1, vp: "VP 21", title: "Subject + Verb",
  formula: "S + V",
  explain: "The shortest English sentence has only a subject and a verb. Nothing has to follow the verb. Such verbs are called intransitive.",
  ex: ["The children are laughing.", "The bell rang.", "Prices have risen.", "Nobody answered.", "The old bridge collapsed.", "My watch has stopped."],
  verbs: "sleep, laugh, cry, arrive, rain, fall, rise, happen, matter, smile",
  watch: [{ bad: "Your opinion doesn't matter it.", good: "Your opinion doesn't matter.", note: "Matter, happen and arrive never take an object." }],
  qs: [
    { t: "m", q: "Which sentence follows S + V only?", o: ["The baby cried.", "The baby wanted milk.", "The baby is hungry.", "The baby gave me a smile."], a: 0, e: "Nothing follows 'cried' — just subject + verb." },
    { t: "m", q: "Choose the correct sentence.", o: ["An accident happened.", "An accident happened it.", "It happened an accident.", "Happened an accident."], a: 0, e: "'Happen' takes no object." },
    { t: "f", q: "The guests have finally ______. (arrive)", a: ["arrived"], e: "Present perfect: have + past participle. No object needed." },
    { t: "m", q: "Which verb CANNOT stand alone after the subject?", o: ["sleep", "rain", "describe", "smile"], a: 2, e: "'Describe' needs an object: describe something." },
    { t: "m", q: "'The ball rolled.' What pattern is the same verb in 'I rolled the ball.'?", o: ["S + V + O (VP 1)", "S + V (VP 21)", "S + V + complement (VP 22)", "S + V + adverbial (VP 23)"], a: 0, e: "Many verbs can be used both ways. With 'the ball' as object it is VP 1." },
    { t: "f", q: "Look! It is ______. Take an umbrella. (rain)", a: ["raining"], e: "Weather verbs use 'it' as subject: It is raining." },
    { t: "m", q: "Pick the sentence in which the verb needs nothing after it.", o: ["The flowers died.", "The flowers need water.", "The flowers look fresh.", "The flowers are in the vase."], a: 0, e: "'Died' completes the sentence by itself." },
    { t: "m", q: "Which is correct?", o: ["What I think does not matter.", "What I think does not matter me.", "What I think not matters.", "What I think does not matters."], a: 0, e: "A clause can be the subject. 'Does not' + base verb 'matter'." }
  ] },

{ id: "u02", level: 1, vp: "VP 22", title: "Subject + Verb + Complement",
  formula: "S + V + Adjective / Noun",
  explain: "Some verbs need a word after them that describes the subject. That word (an adjective or a noun) is the complement. The verb 'be' is the commonest, but become, seem, look, feel, sound, taste, smell, grow, turn and keep work the same way.",
  ex: ["My uncle is a farmer.", "The soup tastes salty.", "Ananya became a pilot.", "You look tired today.", "The leaves turn yellow in autumn.", "Please keep calm."],
  verbs: "be, become, seem, appear, look, feel, sound, taste, smell, grow, turn, keep, remain",
  watch: [{ bad: "The music sounds beautifully.", good: "The music sounds beautiful.", note: "After look, sound, feel, taste and smell we use an adjective, not an adverb, because the word describes the subject." }],
  qs: [
    { t: "m", q: "Choose the correct word: This milk smells ______.", o: ["sour", "sourly", "sourness", "soured it"], a: 0, e: "An adjective describes the milk." },
    { t: "m", q: "Choose the correct sentence.", o: ["She feels happy.", "She feels happily.", "She feels happiness her.", "She happy feels."], a: 0, e: "feel + adjective." },
    { t: "f", q: "Rahul wants to ______ a doctor when he grows up. (become)", a: ["become"], e: "become + noun (a doctor)." },
    { t: "m", q: "In 'The sky grew dark', the word 'dark' is…", o: ["a complement describing the sky", "an object", "an adverb of manner", "a preposition"], a: 0, e: "It tells us what the sky became." },
    { t: "m", q: "Which sentence is VP 22?", o: ["The tea is too hot.", "I drank the tea.", "I gave him tea.", "He sat in the garden."], a: 0, e: "S + be + adjective." },
    { t: "f", q: "The idea ______ good, but will it work? (sound — present)", a: ["sounds"], e: "Third person singular: sounds." },
    { t: "m", q: "Choose the best word: The patient remained ______ all night.", o: ["quiet", "quietly", "quietness", "to quiet"], a: 0, e: "remain + adjective." },
    { t: "m", q: "Which pair shows the same verb used as VP 22 and VP 1?", o: ["He looked angry. / He looked at the map.", "He grew tall. / He grew rice.", "She is kind. / She was kind.", "It rained. / It is raining."], a: 1, e: "'grew tall' = complement (VP 22); 'grew rice' = object (VP 1)." }
  ] },

{ id: "u03", level: 1, vp: "VP 1", title: "Subject + Verb + Object",
  formula: "S + V + Direct Object",
  explain: "Here the verb does something to a person or thing: the direct object. Ask 'what?' or 'whom?' after the verb to find it.",
  ex: ["Meera plays the violin.", "We visited the museum.", "Did you lock the door?", "The dog bit the postman.", "I have lost my pen.", "He hurt himself."],
  verbs: "know, want, like, need, see, find, lose, open, close, meet, visit, enjoy, answer",
  watch: [{ bad: "Please answer to my letter.", good: "Please answer my letter.", note: "Answer, discuss, enter, reach and resemble take a direct object — no preposition." }],
  qs: [
    { t: "m", q: "Find the direct object: 'The farmers planted rice.'", o: ["rice", "farmers", "planted", "The"], a: 0, e: "Planted what? — rice." },
    { t: "m", q: "Choose the correct sentence.", o: ["We discussed the problem.", "We discussed about the problem.", "We discussed on the problem.", "We discussed for the problem."], a: 0, e: "'Discuss' takes a direct object." },
    { t: "m", q: "Choose the correct sentence.", o: ["The train reached Guwahati at noon.", "The train reached to Guwahati at noon.", "The train reached at Guwahati at noon.", "The train reached in Guwahati at noon."], a: 0, e: "reach + place (no preposition). Compare: arrive at / arrive in." },
    { t: "f", q: "Be careful with the knife, or you will cut ______. (reflexive pronoun for 'you')", a: ["yourself"], e: "A reflexive pronoun can be the object." },
    { t: "m", q: "Which sentence has a direct object?", o: ["She enjoyed the film.", "She went home.", "She is a teacher.", "She smiled."], a: 0, e: "Enjoyed what? — the film." },
    { t: "f", q: "He ______ his father very closely. (resemble — present)", a: ["resembles"], e: "resemble + object, no 'to' or 'with'." },
    { t: "m", q: "Choose the correct sentence.", o: ["Please describe what you heard.", "Please describe me what you heard.", "Please describe to what you heard.", "Please describe about what you heard."], a: 0, e: "'Describe' + object. If you want a person, say 'describe it to me'." },
    { t: "m", q: "Which sentence is correct?", o: ["The teacher entered the classroom.", "The teacher entered into the classroom.", "The teacher entered in the classroom.", "The teacher entered to the classroom."], a: 0, e: "enter + place." }
  ] },

{ id: "u04", level: 1, vp: "VP 19", title: "Giving: Indirect + Direct Object",
  formula: "S + V + Indirect Object + Direct Object",
  explain: "Verbs of giving and showing can have two objects: the person who receives (indirect object) and the thing given (direct object). The person comes first. We can also say: give the thing TO the person, or buy the thing FOR the person.",
  ex: ["Grandma told us a story.", "Can you lend me your bicycle?", "She sent her brother a parcel.", "I will show you my garden.", "Dad bought me a new bag.", "The coach gave each player a medal."],
  verbs: "give, lend, send, show, tell, offer, teach, bring, pass, buy, make, get, find, cook",
  watch: [{ bad: "Please explain me this rule.", good: "Please explain this rule to me.", note: "Explain, describe, suggest and announce do NOT follow this pattern. Use 'to + person'." },
          { bad: "She said me the answer.", good: "She told me the answer.", note: "'Tell' takes a person; 'say' does not." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["Explain the meaning to me.", "Explain me the meaning.", "Explain to me meaning.", "Explain me to the meaning."], a: 0, e: "'Explain' cannot take an indirect object before the direct object." },
    { t: "m", q: "Which is correct?", o: ["He told me the news.", "He said me the news.", "He told the news me.", "He said to me news."], a: 0, e: "tell + person + thing." },
    { t: "f", q: "Mother cooked ______ (we) a delicious dinner.", a: ["us"], e: "Object pronoun: us." },
    { t: "m", q: "'I gave the book to Rina.' Which sentence means the same?", o: ["I gave Rina the book.", "I gave the book Rina.", "I gave to Rina book.", "I Rina gave the book."], a: 0, e: "Person first, then thing — no 'to'." },
    { t: "m", q: "Which preposition? 'She bought a gift ___ her teacher.'", o: ["for", "to", "at", "with"], a: 0, e: "buy / make / cook / get something FOR someone." },
    { t: "m", q: "Which preposition? 'Please pass the salt ___ me.'", o: ["to", "for", "at", "of"], a: 0, e: "give / pass / send / lend something TO someone." },
    { t: "m", q: "Choose the correct sentence.", o: ["Can you suggest a good book to me?", "Can you suggest me a good book?", "Can you suggest me to a good book?", "Can you suggest to me book?"], a: 0, e: "'Suggest' uses 'to + person'." },
    { t: "f", q: "Will you ______ me your notes? I missed the class. (lend / borrow)", a: ["lend"], e: "You LEND something to someone; you BORROW something from someone." }
  ] },

{ id: "u05", level: 1, vp: "VP 23", title: "Verb + Where / How",
  formula: "S + V + Adverbial (place, direction, manner)",
  explain: "Some verbs need an adverbial to complete their meaning: where someone lives, where something lies, how someone behaves. Words such as in, out, up, back, upstairs, home often finish the sentence.",
  ex: ["My cousins live in Jorhat.", "Please sit down.", "The keys are lying on the table.", "She walked out.", "We got home late.", "He behaves as if he were the boss."],
  verbs: "live, stay, sit, stand, lie, come, go, get, arrive, behave, work",
  watch: [{ bad: "We went to home early.", good: "We went home early.", note: "'Home' needs no 'to' after go, come, get, arrive." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["I came home at six.", "I came to home at six.", "I came at home at six.", "I came in home at six."], a: 0, e: "'home' is used without 'to'." },
    { t: "m", q: "Which sentence is incomplete without its adverbial?", o: ["She lives near the river.", "She laughed loudly.", "She sang beautifully.", "She slept well."], a: 0, e: "'She lives.' alone doesn't say where — 'live' here needs the adverbial." },
    { t: "f", q: "Stand ______! The national anthem is starting. (opposite of 'down')", a: ["up"], e: "stand up — an adverbial particle completes the verb." },
    { t: "m", q: "Choose the correct word: He works very ______.", o: ["hard", "hardly", "harder of", "hardness"], a: 0, e: "'hard' is the adverb here. 'Hardly' means 'almost not'." },
    { t: "m", q: "Choose the best sentence.", o: ["There is a temple on the hill.", "A temple is on the hill.", "On the hill is temple.", "There is on the hill a temple is."], a: 0, e: "When the subject is indefinite ('a temple'), English prefers 'There is…'." },
    { t: "f", q: "The children ran ______ (direction: to the outside) to play.", a: ["out", "outside"], e: "run out / run outside." },
    { t: "m", q: "Which is correct?", o: ["Here comes the bus!", "Here the bus comes!", "Here come the bus!", "Comes here the bus!"], a: 0, e: "With a noun subject: Here + verb + subject. With a pronoun: Here it comes!" },
    { t: "m", q: "Choose the correct order.", o: ["There she goes!", "There goes she!", "Goes there she!", "She there goes!"], a: 0, e: "With a pronoun subject: There + pronoun + verb." }
  ] },

{ id: "u06", level: 1, vp: "Basics", title: "Asking and Saying No",
  formula: "Helper verb (is, can, will, has, do…) + not / question order",
  explain: "Helper verbs such as am, is, are, was, have, has, can, will, must and should make negatives by adding 'not' and questions by moving in front of the subject. Ordinary verbs need do, does or did. A short question at the end (a tag) uses the same helper verb.",
  ex: ["She can't swim yet.", "Have you finished your homework?", "Does your brother play chess?", "We didn't see the match.", "It's cold today, isn't it?", "You won't forget, will you?"],
  verbs: "am, is, are, was, were, have, has, had, do, does, did, can, could, will, would, shall, should, may, might, must",
  watch: [{ bad: "Did you went to school?", good: "Did you go to school?", note: "After do, does or did, use the base form of the verb." }],
  qs: [
    { t: "m", q: "Make it negative: 'He likes mangoes.'", o: ["He doesn't like mangoes.", "He don't like mangoes.", "He doesn't likes mangoes.", "He not likes mangoes."], a: 0, e: "does not + base form." },
    { t: "m", q: "Make a question: 'They have left.'", o: ["Have they left?", "Do they have left?", "Did they left?", "They have left?"], a: 0, e: "'Have' is a helper here — move it to the front." },
    { t: "f", q: "You are coming with us, ______ you?", a: ["aren't"], e: "Positive sentence → negative tag with the same helper: aren't you?" },
    { t: "f", q: "She didn't call, ______ she?", a: ["did"], e: "Negative sentence → positive tag." },
    { t: "m", q: "Choose the correct question.", o: ["Where does she live?", "Where she lives?", "Where does she lives?", "Where lives she?"], a: 0, e: "Question word + does + subject + base verb." },
    { t: "m", q: "Choose the correct tag: 'Let's go for a walk, ___?'", o: ["shall we", "will you", "don't we", "aren't we"], a: 0, e: "Let's … , shall we?" },
    { t: "f", q: "I'm late, ______ I? (tag)", a: ["aren't"], e: "The tag for 'I am' is 'aren't I?'" },
    { t: "m", q: "Which is correct?", o: ["Can you help me?", "Do you can help me?", "Can you to help me?", "You can help me do?"], a: 0, e: "'Can' never takes do; it is followed by a bare infinitive." }
  ] },

// ───────────────────────── LEVEL 2 ─────────────────────────
{ id: "u07", level: 2, vp: "VP 2", title: "Verb + to-infinitive",
  formula: "S + V + (not) to + verb",
  explain: "Many verbs that talk about plans, wishes and attempts are followed by 'to' + a verb. Put 'not' before 'to' to make the infinitive negative.",
  ex: ["Priya hopes to study medicine.", "They decided not to wait.", "I forgot to bring my lunch.", "He has promised to write every week.", "We are learning to drive.", "She pretended not to hear."],
  verbs: "want, hope, decide, plan, promise, refuse, agree, learn, try, forget, remember, intend, pretend, offer, manage, fail, afford",
  watch: [{ bad: "I want that you come.", good: "I want you to come.", note: "'Want' never takes a that-clause." },
          { bad: "They decided to not go.", good: "They decided not to go.", note: "'Not' goes before 'to'." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["He refused to answer.", "He refused answering.", "He refused that he answer.", "He refused answer."], a: 0, e: "refuse + to-infinitive." },
    { t: "f", q: "We can't afford ______ a new car this year. (buy)", a: ["to buy"], e: "afford + to-infinitive." },
    { t: "m", q: "Where does 'not' go? 'She promised ___ late again.'", o: ["not to be", "to not be", "to be not", "not be to"], a: 0, e: "not + to-infinitive." },
    { t: "f", q: "Did you remember ______ the lights off? (switch)", a: ["to switch"], e: "remember to do = not forget to do (a future duty)." },
    { t: "m", q: "Which verb is NOT followed by a to-infinitive?", o: ["enjoy", "hope", "decide", "plan"], a: 0, e: "'Enjoy' takes -ing: enjoy playing." },
    { t: "m", q: "Choose the correct sentence.", o: ["I have to leave early today.", "I have leave early today.", "I have leaving early today.", "I have for leave early today."], a: 0, e: "'have to' + verb expresses obligation." },
    { t: "f", q: "He managed ______ the last bus. (catch)", a: ["to catch"], e: "manage + to-infinitive = succeed in doing." },
    { t: "m", q: "'You had better ___ now.' Choose the correct form.", o: ["go", "to go", "going", "gone"], a: 0, e: "'had better' and 'would rather' are followed by a bare infinitive." }
  ] },

{ id: "u08", level: 2, vp: "VP 17", title: "Verb + -ing (gerund)",
  formula: "S + V + verb-ing",
  explain: "Some verbs are followed by the -ing form of another verb (the gerund). Learn these verbs as a group: enjoy, finish, avoid, mind, keep, practise, suggest, deny, give up, can't help.",
  ex: ["My sister enjoys painting.", "Have you finished packing?", "Would you mind closing the window?", "He kept talking during the film.", "She denied breaking the vase.", "I can't help laughing at his jokes."],
  verbs: "enjoy, finish, avoid, mind, keep, practise, suggest, deny, miss, risk, imagine, give up, put off, can't help, can't stand",
  watch: [{ bad: "I suggest to start early.", good: "I suggest starting early. / I suggest that we start early.", note: "'Suggest' never takes a to-infinitive." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["She avoids eating junk food.", "She avoids to eat junk food.", "She avoids eat junk food.", "She avoids that she eats junk food."], a: 0, e: "avoid + -ing." },
    { t: "f", q: "Would you mind ______ a little louder? (speak)", a: ["speaking"], e: "mind + -ing." },
    { t: "m", q: "Choose the correct sentence.", o: ["He suggested going by train.", "He suggested to go by train.", "He suggested us to go by train.", "He suggested go by train."], a: 0, e: "suggest + -ing (or suggest that…)." },
    { t: "f", q: "My grandfather gave up ______ ten years ago. (smoke)", a: ["smoking"], e: "give up + -ing." },
    { t: "m", q: "Which verb takes -ing?", o: ["practise", "hope", "want", "promise"], a: 0, e: "practise speaking, practise writing." },
    { t: "f", q: "I can't help ______ when I see that video. (smile)", a: ["smiling"], e: "can't help + -ing = can't stop myself." },
    { t: "m", q: "'Reading is my hobby.' Here 'reading' is…", o: ["a gerund used as subject", "a present participle in a tense", "an adjective", "an infinitive"], a: 0, e: "A gerund behaves like a noun." },
    { t: "f", q: "They finished ______ the hall at midnight. (decorate)", a: ["decorating"], e: "finish + -ing." }
  ] },

{ id: "u09", level: 2, vp: "VP 25", title: "Verb + to-infinitive of Purpose",
  formula: "S + V + to + verb (= in order to)",
  explain: "Here the verb is complete on its own, and the to-infinitive tells us WHY (purpose) or WHAT HAPPENED next (result). Ask 'Why?' — if 'in order to' fits, it is purpose.",
  ex: ["We stopped to buy some fruit.", "She went to the post office to send a letter.", "He stood on a chair to reach the shelf.", "I came here to learn.", "They hurried to catch the train.", "He woke up to find the house empty."],
  verbs: "come, go, stop, wait, hurry, run, stand, sit, live (to be 90), wake (to find)",
  watch: [{ bad: "She went to the market for buying vegetables.", good: "She went to the market to buy vegetables.", note: "Use the to-infinitive, not 'for + -ing', to show a person's purpose." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["He went to the bank to withdraw money.", "He went to the bank for withdraw money.", "He went to the bank for to withdraw money.", "He went to the bank withdrawing money."], a: 0, e: "to-infinitive of purpose." },
    { t: "m", q: "'We stopped to have tea.' This means…", o: ["We stopped what we were doing so that we could have tea.", "We no longer have tea.", "We stopped drinking tea.", "We hate tea."], a: 0, e: "stop + to-infinitive = stop in order to do." },
    { t: "f", q: "She saved money ______ a laptop. (buy — purpose)", a: ["to buy"], e: "Purpose: to buy." },
    { t: "m", q: "Which sentence shows RESULT, not purpose?", o: ["He returned home to find his dog waiting.", "He returned home to rest.", "He returned home to fetch his book.", "He returned home to change."], a: 0, e: "He didn't go home in order to find the dog — it is what he discovered." },
    { t: "f", q: "Speak slowly so as not ______ the children. (confuse)", a: ["to confuse"], e: "so as not to = negative purpose." },
    { t: "m", q: "Choose the best sentence.", o: ["My great-grandmother lived to be ninety-five.", "My great-grandmother lived for being ninety-five.", "My great-grandmother lived being ninety-five.", "My great-grandmother lived that she was ninety-five."], a: 0, e: "live to be + age (outcome)." },
    { t: "m", q: "'I ran to help her.' What does the to-infinitive tell us?", o: ["why I ran", "where I ran", "when I ran", "how fast I ran"], a: 0, e: "Purpose — why." },
    { t: "f", q: "We got up early ______ the sunrise. (watch)", a: ["to watch"], e: "Purpose." }
  ] },

{ id: "u10", level: 2, vp: "VP 24", title: "Verb + Preposition + Object",
  formula: "S + V + preposition + object",
  explain: "Some verbs must be followed by a particular preposition. Learn the verb and its preposition together, as one unit: listen to, look at, depend on, belong to, wait for, succeed in, agree with, complain about.",
  ex: ["Everyone listened to the speaker.", "This umbrella belongs to my aunt.", "We are waiting for the results.", "Our trip depends on the weather.", "She succeeded in winning the scholarship.", "I agree with you."],
  verbs: "listen to, look at, look for, wait for, depend on, rely on, belong to, succeed in, insist on, agree with, agree to, apologise for, complain about, care for, long for",
  watch: [{ bad: "Please listen me.", good: "Please listen to me.", note: "'Listen' always needs 'to' before its object." }],
  qs: [
    { t: "m", q: "Choose the correct preposition: 'You can rely ___ him.'", o: ["on", "in", "at", "to"], a: 0, e: "rely on / depend on." },
    { t: "m", q: "Choose the correct preposition: 'He succeeded ___ passing the test.'", o: ["in", "to", "on", "at"], a: 0, e: "succeed in + -ing." },
    { t: "f", q: "Who does this red pen belong ______?", a: ["to"], e: "belong to someone." },
    { t: "m", q: "Choose the correct sentence.", o: ["She insisted on paying the bill.", "She insisted to pay the bill.", "She insisted paying the bill.", "She insisted for paying the bill."], a: 0, e: "insist on + -ing." },
    { t: "m", q: "Which is correct? 'I agree ___ your plan.' (= I accept the proposal)", o: ["to", "with", "at", "for"], a: 0, e: "agree TO a plan/proposal; agree WITH a person or opinion." },
    { t: "f", q: "Stop staring! It's rude to look ______ people like that.", a: ["at"], e: "look at." },
    { t: "m", q: "Make it passive: 'People can rely on that man.'", o: ["That man can be relied on.", "That man can be relied.", "That man can relied on.", "On that man can be relied."], a: 0, e: "In the passive, the preposition stays at the end." },
    { t: "f", q: "The students apologised ______ being late.", a: ["for"], e: "apologise for something." }
  ] },

{ id: "u11", level: 2, vp: "VP 10", title: "Verb + Object + Where",
  formula: "S + V + Object + Adverbial",
  explain: "Verbs such as put, place, keep, take and leave need an object AND a word that says where. With short particles (on, off, away, back, up) the order depends on the object: a noun can go before or after the particle, but a pronoun (it, them) must go before.",
  ex: ["Put the milk in the fridge.", "She hung her coat on the hook.", "Please take your shoes off.", "Please take off your shoes.", "Put it away.", "He kept his hands in his pockets."],
  verbs: "put, place, set, lay, keep, leave, take, bring, send, throw, hang, turn (on/off), switch (on/off)",
  watch: [{ bad: "Switch off it.", good: "Switch it off.", note: "A pronoun object goes between the verb and the particle." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["Turn it off.", "Turn off it.", "It turn off.", "Off turn it."], a: 0, e: "Pronoun before the particle." },
    { t: "m", q: "Which two are BOTH correct?", o: ["Put on your helmet. / Put your helmet on.", "Put on it. / Put it on.", "Put on them. / Put them on.", "On put it. / Put it on."], a: 0, e: "A noun can go either side of the particle." },
    { t: "f", q: "These toys are lying everywhere. Please put ______ away. (pronoun)", a: ["them"], e: "put them away." },
    { t: "m", q: "Which sentence is VP 10?", o: ["She placed the vase on the table.", "She bought a vase.", "She is a potter.", "She gave me a vase."], a: 0, e: "verb + object + place." },
    { t: "m", q: "Choose the correct sentence.", o: ["Please bring it back tomorrow.", "Please bring back it tomorrow.", "Please back bring it tomorrow.", "Please bring it tomorrow back it."], a: 0, e: "bring it back." },
    { t: "f", q: "Don't leave your bag ______ the floor. (preposition)", a: ["on"], e: "leave something on the floor." },
    { t: "m", q: "For a long object, which order sounds best?", o: ["Throw away all the papers that are torn.", "Throw all the papers that are torn away.", "Away throw all the papers that are torn.", "Throw all away the papers that are torn."], a: 0, e: "A long, 'heavy' object comes last." },
    { t: "f", q: "It's dark in here. Could you switch the light ______?", a: ["on"], e: "switch on / switch the light on." }
  ] },

{ id: "u12", level: 2, vp: "VP 20", title: "Verb + How Far / How Long",
  formula: "S + V + (for) + distance / time / weight / price",
  explain: "Some verbs are followed by a phrase of distance, time, weight or price. 'For' is often optional before time and distance.",
  ex: ["We walked (for) five kilometres.", "The meeting lasted two hours.", "The parcel weighs three kilos.", "This shirt cost four hundred rupees.", "I waited (for) twenty minutes.", "The festival lasts a week."],
  verbs: "walk, run, swim, wait, last, stay, weigh, cost, measure",
  watch: [{ bad: "The book costed fifty rupees.", good: "The book cost fifty rupees.", note: "'Cost' does not change in the past." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["The film lasted three hours.", "The film lasted for three hours long.", "The film was lasting three hours ago.", "The film lasted since three hours."], a: 0, e: "last + time." },
    { t: "f", q: "Yesterday the tickets ______ ninety rupees each. (cost)", a: ["cost"], e: "cost – cost – cost." },
    { t: "m", q: "Which word is NOT needed? 'We waited for an hour.'", o: ["for (it is optional)", "We", "waited", "hour"], a: 0, e: "'We waited an hour' is also correct." },
    { t: "m", q: "Choose the correct question.", o: ["How much does it weigh?", "How much it weighs?", "How much does it weighs?", "How weighs it?"], a: 0, e: "does + subject + base form." },
    { t: "f", q: "She swam (for) ______ hour without stopping. (article)", a: ["an"], e: "'an hour' — 'hour' begins with a vowel sound." },
    { t: "m", q: "Which sentence is VP 20?", o: ["The storm lasted all night.", "The storm damaged the roof.", "The storm was violent.", "The storm came suddenly."], a: 0, e: "last + time phrase." },
    { t: "m", q: "Choose the correct sentence.", o: ["I have been waiting for two hours.", "I am waiting since two hours.", "I wait from two hours.", "I have waited since two hours."], a: 0, e: "'for' + a period of time; 'since' + a point of time." },
    { t: "f", q: "We stayed in Shillong ______ a whole week.", a: ["for"], e: "stay (for) + a period of time." }
  ] },

{ id: "u13", level: 2, vp: "VP 7", title: "Verb + Object + Adjective",
  formula: "S + V + Object + Adjective",
  explain: "After the object we put an adjective that shows the result or state of the object: make someone happy, keep the room clean, paint a wall blue, find a box empty.",
  ex: ["The news made everyone happy.", "Keep your desk tidy.", "They painted the gate green.", "I found the classroom empty.", "Don't leave the door open.", "The heat drove the dogs crazy."],
  verbs: "make, keep, leave, get, paint, colour, find, push (open), set (free), wipe (clean), turn",
  watch: [{ bad: "Please keep the room cleanly.", good: "Please keep the room clean.", note: "The word describes the object, so it is an adjective." }],
  qs: [
    { t: "m", q: "Choose the correct word: 'The long walk made me ___.'", o: ["hungry", "hungrily", "hunger", "to hungry"], a: 0, e: "make + object + adjective." },
    { t: "f", q: "Please keep the door ______. It's hot inside. (opposite of 'shut')", a: ["open"], e: "keep the door open." },
    { t: "m", q: "'I found the test easy.' This means…", o: ["I thought the test was easy.", "I looked for the test easily.", "I easily found the test paper.", "The test found me."], a: 0, e: "find + object + adjective = discover/feel that it is…" },
    { t: "m", q: "Make it passive: 'They set the birds free.'", o: ["The birds were set free.", "The birds were set freely.", "The birds set free were.", "Free were set the birds."], a: 0, e: "The adjective stays after the verb." },
    { t: "f", q: "Wipe the board ______ before the next class. (adjective)", a: ["clean"], e: "wipe something clean." },
    { t: "m", q: "Choose the correct sentence.", o: ["He made it clear that he disagreed.", "He made clear it that he disagreed.", "He made that he disagreed clear.", "He clear made it that he disagreed."], a: 0, e: "Use preparatory 'it' when the object is a that-clause." },
    { t: "m", q: "Which sentence is VP 7?", o: ["Hard work kept him busy.", "Hard work is good.", "He works hard.", "He likes hard work."], a: 0, e: "keep + him + busy." },
    { t: "f", q: "The cold wind turned her cheeks ______. (colour)", a: ["red", "pink"], e: "turn + object + adjective of colour." }
  ] },

{ id: "u14", level: 2, vp: "VP 8", title: "Verb + Object + Noun",
  formula: "S + V + Object + Noun",
  explain: "The noun after the object names what the object becomes or is called: elect someone captain, name a baby Riya, make someone the leader, call a place home.",
  ex: ["The class elected Arjun monitor.", "They named their daughter Ishani.", "We call our dog Bholu.", "The board appointed her principal.", "His hard work made him a champion.", "They crowned the winner queen of the festival."],
  verbs: "elect, appoint, name, call, make, crown, choose, consider, think",
  watch: [{ bad: "They elected him as a captain.", good: "They elected him captain.", note: "No article before a title held by one person: elect him captain / chairman / president." }],
  qs: [
    { t: "m", q: "Choose the best sentence.", o: ["We chose Neha leader of the group.", "We chose Neha a leader of the group.", "We chose to Neha leader.", "We chose leader Neha of the group."], a: 0, e: "A unique role usually takes no article." },
    { t: "f", q: "Everybody ______ him 'Babu', though his real name is Rajiv. (call — present)", a: ["calls"], e: "call + object + noun." },
    { t: "m", q: "Which sentence is VP 8?", o: ["They made him captain.", "They made him laugh.", "They made him angry.", "They made him a cake."], a: 0, e: "him = captain (the object becomes the noun). 'Made him a cake' is VP 19." },
    { t: "m", q: "Make it passive: 'They appointed Mr Das secretary.'", o: ["Mr Das was appointed secretary.", "Mr Das was appointed to secretary.", "Secretary was appointed Mr Das.", "Mr Das appointed secretary."], a: 0, e: "The noun stays after the verb." },
    { t: "f", q: "The parents ______ the baby Aarav. (name — past)", a: ["named"], e: "name + object + noun." },
    { t: "m", q: "In 'They made him a cake', what is 'a cake'?", o: ["direct object (he received a cake)", "what he became", "an adjective", "an adverb"], a: 0, e: "He didn't become a cake! This is VP 19." },
    { t: "m", q: "Choose the correct sentence.", o: ["The school made reading a daily habit.", "The school made reading to a daily habit.", "The school made reading as daily habit.", "The school made a daily habit reading to."], a: 0, e: "make + object + noun." },
    { t: "f", q: "The people ______ (elect — past) her mayor for a second time.", a: ["elected"], e: "elect + object + noun." }
  ] },

// ───────────────────────── LEVEL 3 ─────────────────────────
{ id: "u15", level: 3, vp: "VP 3", title: "Verb + Object + to-infinitive",
  formula: "S + V + Object + (not) to + verb",
  explain: "Verbs of asking, telling, wanting and allowing are often followed by a person and a to-infinitive. The person is the one who does the second action.",
  ex: ["The teacher asked us to sit quietly.", "My parents allowed me to go on the trip.", "I want you to listen carefully.", "She warned her son not to touch the stove.", "The doctor advised him to rest.", "We invited them to stay for dinner."],
  verbs: "ask, tell, want, allow, permit, advise, warn, invite, order, encourage, expect, remind, persuade, force, help, teach",
  watch: [{ bad: "He told that I should come.", good: "He told me to come.", note: "'Tell' needs a person object." },
          { bad: "She made me to wait.", good: "She made me wait.", note: "'Make' and 'let' take a bare infinitive (VP 5), not 'to'." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["I want you to help me.", "I want that you help me.", "I want you help me.", "I want you helping me."], a: 0, e: "want + object + to-infinitive." },
    { t: "f", q: "The coach told the players ______ late. (not / be)", a: ["not to be"], e: "tell + object + not + to-infinitive." },
    { t: "m", q: "Make it passive: 'They warned me not to go out.'", o: ["I was warned not to go out.", "I was warned to not going out.", "I warned not to go out.", "Me was warned not to go out."], a: 0, e: "Object becomes subject; the to-infinitive stays." },
    { t: "f", q: "Please remind me ______ the bill. (pay)", a: ["to pay"], e: "remind + person + to-infinitive." },
    { t: "m", q: "Choose the correct sentence.", o: ["She encouraged her students to ask questions.", "She encouraged to her students ask questions.", "She encouraged her students asking questions.", "She encouraged that her students ask questions to."], a: 0, e: "encourage + object + to-infinitive." },
    { t: "m", q: "Which verb does NOT fit 'He ___ me to stay.'?", o: ["suggested", "asked", "wanted", "persuaded"], a: 0, e: "'Suggest' cannot take object + to-infinitive. Say: He suggested that I (should) stay." },
    { t: "m", q: "Choose the most natural sentence.", o: ["I don't want there to be any trouble.", "I don't want any trouble to be.", "I don't want that there is trouble.", "I don't want trouble be."], a: 0, e: "When 'be' has no complement, use 'there to be'." },
    { t: "f", q: "Who taught you ______ so well? (sing)", a: ["to sing"], e: "teach + person + to-infinitive." }
  ] },

{ id: "u16", level: 3, vp: "VP 5", title: "Verb + Object + Bare Infinitive",
  formula: "S + V + Object + verb (no 'to')",
  explain: "Two groups of verbs take an object and an infinitive WITHOUT 'to'. (A) Verbs of the senses — see, hear, watch, feel, notice — for a complete action. (B) make, let, have and often help. In the passive, 'to' comes back: He was made to apologise.",
  ex: ["I heard someone knock at the door.", "We watched the sun go down.", "Let me carry that bag.", "The joke made everyone laugh.", "Did you see the boy fall?", "Please have the driver wait outside."],
  verbs: "see, hear, watch, feel, notice, observe, listen to, look at, make, let, have, help, bid",
  watch: [{ bad: "Let me to explain.", good: "Let me explain.", note: "No 'to' after let and make in the active voice." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["My mother made me apologise.", "My mother made me to apologise.", "My mother made me apologising.", "My mother made that I apologise."], a: 0, e: "make + object + bare infinitive." },
    { t: "m", q: "Make it passive: 'They made him repeat the work.'", o: ["He was made to repeat the work.", "He was made repeat the work.", "He was made repeating the work.", "He made to repeat the work."], a: 0, e: "In the passive, 'to' is needed." },
    { t: "f", q: "Will your parents let you ______ the film? (watch)", a: ["watch"], e: "let + object + bare infinitive." },
    { t: "m", q: "'I saw her cross the road.' This suggests…", o: ["I saw the whole action from start to finish.", "I saw only part of the action.", "She was going to cross.", "I didn't see her."], a: 0, e: "Bare infinitive = complete action. Compare 'I saw her crossing' (in progress)." },
    { t: "f", q: "I felt the ground ______ under my feet. (shake)", a: ["shake"], e: "feel + object + bare infinitive." },
    { t: "m", q: "Which is correct?", o: ["Could you help me (to) lift this box?", "Could you help me lifting this box?", "Could you help to me lift this box?", "Could you help me that I lift this box?"], a: 0, e: "help can take the infinitive with or without 'to'." },
    { t: "m", q: "Choose the correct sentence.", o: ["What makes you think so?", "What makes you to think so?", "What makes you thinking so?", "What makes that you think so?"], a: 0, e: "make + object + bare infinitive." },
    { t: "f", q: "Listen to the birds ______ ! (sing)", a: ["sing"], e: "'Listen to' and 'look at' work like see/hear here." }
  ] },

{ id: "u17", level: 3, vp: "VP 6", title: "Verb + Object + -ing",
  formula: "S + V + Object + verb-ing",
  explain: "Here the -ing form shows an action in progress. With see, hear, watch and smell it means we noticed the action while it was going on. Other verbs — find, catch, keep, leave, set, start, get — also use this pattern.",
  ex: ["I saw a snake sliding through the grass.", "Can you smell something burning?", "The teacher caught two boys copying.", "Don't keep the guests waiting.", "We left the baby sleeping.", "The story set me thinking."],
  verbs: "see, hear, watch, feel, smell, notice, find, catch, keep, leave, set, start, get, have (= allow)",
  watch: [{ bad: "Sorry for keeping you wait.", good: "Sorry for keeping you waiting.", note: "'Keep' + object + -ing." }],
  qs: [
    { t: "m", q: "'I heard the children singing.' This means…", o: ["The singing was going on when I heard it.", "I heard the whole song from start to end.", "The children will sing.", "The children stopped singing."], a: 0, e: "-ing = action in progress." },
    { t: "f", q: "Sorry to keep you ______. (wait)", a: ["waiting"], e: "keep + object + -ing." },
    { t: "m", q: "Make it passive: 'Someone found him sleeping under a tree.'", o: ["He was found sleeping under a tree.", "He was found to sleeping under a tree.", "He found sleeping under a tree.", "He was found sleep under a tree."], a: 0, e: "The -ing form stays the same." },
    { t: "f", q: "The guard caught the thief ______ over the wall. (climb)", a: ["climbing"], e: "catch + object + -ing." },
    { t: "m", q: "Choose the correct sentence.", o: ["Get the engine running before it gets cold.", "Get the engine to running before it gets cold.", "Get the engine run before it gets cold.", "Get running the engine to before."], a: 0, e: "get + object + -ing." },
    { t: "m", q: "Which sentence shows a COMPLETE action?", o: ["I watched him score the goal.", "I watched him dribbling the ball.", "I watched them playing.", "I watched the rain falling."], a: 0, e: "Bare infinitive (VP 5) = complete action; -ing (VP 6) = in progress." },
    { t: "f", q: "I can't have you ______ like that in class! (behave)", a: ["behaving"], e: "can't have + object + -ing = won't allow." },
    { t: "m", q: "Choose the correct sentence.", o: ["Can you imagine my grandmother riding a scooter?", "Can you imagine my grandmother to ride a scooter?", "Can you imagine my grandmother rides a scooter?", "Can you imagine to my grandmother riding?"], a: 0, e: "imagine + object + -ing." }
  ] },

{ id: "u18", level: 3, vp: "VP 9", title: "Verb + Object + Past Participle",
  formula: "S + V + Object + past participle",
  explain: "Use have or get + object + past participle when someone else does a job for you: I had my hair cut. It can also show something that happened to you: She had her phone stolen. Want, like, need, see, hear and find also use this pattern.",
  ex: ["I had my eyes tested.", "We are getting our house painted.", "She had her purse stolen on the bus.", "I want this letter typed by noon.", "He heard his name called.", "They found the window broken."],
  verbs: "have, get, want, need, like, prefer, see, hear, find, make (oneself understood)",
  watch: [{ bad: "I cut my hair yesterday. (when a barber did it)", good: "I had my hair cut yesterday.", note: "If someone else does the job, use have / get + object + past participle." }],
  qs: [
    { t: "m", q: "Your tailor stitched your new kurta. You say…", o: ["I had my kurta stitched.", "I stitched my kurta.", "I had stitched my kurta.", "I had my kurta stitch."], a: 0, e: "have + object + past participle." },
    { t: "f", q: "Where do you get your shoes ______? (repair)", a: ["repaired"], e: "get + object + past participle." },
    { t: "m", q: "Choose the correct sentence.", o: ["He couldn't make himself understood.", "He couldn't make himself understand.", "He couldn't make himself understanding.", "He couldn't make himself to understand."], a: 0, e: "make oneself understood = make others understand you." },
    { t: "f", q: "I heard my name ______ (call) from the back of the hall.", a: ["called"], e: "hear + object + past participle (passive meaning)." },
    { t: "m", q: "'She had her bag snatched.' This means…", o: ["Someone snatched her bag (a bad experience).", "She paid someone to snatch her bag.", "She snatched a bag.", "Her bag is still with her."], a: 0, e: "have + object + past participle can show an unpleasant experience." },
    { t: "f", q: "We need the documents ______ (sign) today.", a: ["signed"], e: "need + object + past participle." },
    { t: "m", q: "Which is VP 9?", o: ["They had the room cleaned.", "They had cleaned the room.", "They cleaned the room.", "They had a clean room."], a: 0, e: "'had cleaned' is a past perfect tense — a different structure." },
    { t: "f", q: "I'd like these photos ______ (print) in colour.", a: ["printed"], e: "like + object + past participle." }
  ] },

{ id: "u19", level: 3, vp: "VP 11", title: "Verb + that-clause",
  formula: "S + V + (that) + clause",
  explain: "Verbs of saying, thinking, knowing, hoping and deciding are often followed by a clause. 'That' is often left out in conversation.",
  ex: ["I think (that) it will rain.", "She said (that) she was busy.", "We hope (that) you feel better soon.", "He admitted that he had made a mistake.", "They decided that the picnic should be postponed.", "I suppose you're right."],
  verbs: "say, think, know, believe, hope, decide, agree, feel, suppose, admit, explain, suggest, notice, realise, wish",
  watch: [{ bad: "I hope that you to come.", good: "I hope (that) you will come.", note: "A that-clause has its own subject and full verb." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["He said that he was tired.", "He said me that he was tired.", "He said to tired.", "He said him tired."], a: 0, e: "say + that-clause (no person object)." },
    { t: "m", q: "Which word can be left out? 'I know that you are busy.'", o: ["that", "know", "you", "are"], a: 0, e: "'That' is often omitted after common verbs." },
    { t: "f", q: "She suggested that we ______ (take) a taxi.", a: ["take", "should take"], e: "suggest that + subject + (should) + base verb." },
    { t: "m", q: "Choose the correct sentence.", o: ["I realised that I had left my keys behind.", "I realised to leave my keys behind.", "I realised me that I had left my keys.", "I realised leaving my keys that."], a: 0, e: "realise + that-clause." },
    { t: "f", q: "Do you think ______ (it / pronoun + will) be sunny tomorrow?", a: ["it will", "that it will"], e: "think (that) it will…" },
    { t: "m", q: "Which verb CANNOT be followed directly by a that-clause?", o: ["want", "hope", "think", "believe"], a: 0, e: "Use 'want someone to do' (VP 3)." },
    { t: "m", q: "Choose the polite reply: 'Will it rain?'", o: ["I'm afraid so.", "I'm afraid it.", "I'm afraid that.", "I'm afraid yes."], a: 0, e: "'so' replaces a that-clause after think, hope, suppose, be afraid." },
    { t: "f", q: "I hope ______. (short reply meaning 'I hope it will not happen')", a: ["not"], e: "I hope so / I hope not." }
  ] },

{ id: "u20", level: 3, vp: "VP 12", title: "Verb + Person + that-clause",
  formula: "S + V + Object + (that) + clause",
  explain: "Some verbs need a person object before the that-clause: tell, inform, remind, warn, assure, convince, promise, persuade.",
  ex: ["She told me (that) she would be late.", "Please remind him that the shop closes at six.", "The pilot assured us that there was no danger.", "We warned them that the road was flooded.", "I promised Mother that I would study.", "He convinced the judges that he was innocent."],
  verbs: "tell, inform, remind, warn, assure, convince, persuade, promise, satisfy, teach, show",
  watch: [{ bad: "He informed that the train was late.", good: "He informed us that the train was late.", note: "'Inform' and 'tell' need a person object." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["She told us that the exam was postponed.", "She told that the exam was postponed.", "She said us that the exam was postponed.", "She told to us the exam postponed."], a: 0, e: "tell + person + that-clause." },
    { t: "f", q: "The principal informed ______ (the parents) that the school would reopen on Monday.", a: ["the parents"], e: "inform + person + that-clause." },
    { t: "m", q: "Which verb fits? 'He ___ that he was right.' (no person)", o: ["insisted", "told", "informed", "assured"], a: 0, e: "insist + that-clause (VP 11). The others need a person (VP 12)." },
    { t: "f", q: "Can you assure ______ (I) that this is safe?", a: ["me"], e: "Object pronoun." },
    { t: "m", q: "Make it passive: 'They told us that the bus was cancelled.'", o: ["We were told that the bus was cancelled.", "We told that the bus was cancelled.", "That the bus was cancelled told us.", "Us were told the bus was cancelled."], a: 0, e: "The person becomes the subject." },
    { t: "m", q: "Choose the correct sentence.", o: ["I reminded her that the library books were due.", "I reminded that the library books were due.", "I reminded to her that books due.", "I reminded her the library books that were due."], a: 0, e: "remind + person + that-clause." },
    { t: "f", q: "I warned ______ (they) that the dog might bite.", a: ["them"], e: "warn + person + that-clause." },
    { t: "m", q: "Choose the correct sentence.", o: ["He promised me that he would return the book.", "He promised that me he would return the book.", "He promised to me that returning the book.", "He promised me return the book."], a: 0, e: "promise + person + that-clause." }
  ] },

{ id: "u21", level: 3, vp: "VP 18", title: "Verb + Object + Preposition + Object",
  formula: "S + V + Object + preposition + Object",
  explain: "These verbs have a direct object and then a fixed preposition with a second object: thank someone FOR, blame someone FOR, accuse someone OF, remind someone OF, congratulate someone ON, protect someone FROM, compare one thing WITH another.",
  ex: ["We thanked the driver for his help.", "She congratulated her friend on her success.", "They accused him of cheating.", "This song reminds me of my village.", "Don't blame others for your mistakes.", "Sunglasses protect your eyes from the glare."],
  verbs: "thank for, blame for, accuse of, remind of, rob of, congratulate on, protect from, prevent from, compare with, provide with, explain to, introduce to, borrow from",
  watch: [{ bad: "They congratulated him for winning.", good: "They congratulated him on winning.", note: "congratulate ON." }],
  qs: [
    { t: "m", q: "Choose the correct preposition: 'They accused the boy ___ lying.'", o: ["of", "for", "on", "with"], a: 0, e: "accuse of." },
    { t: "f", q: "Thank you ______ the lovely gift.", a: ["for"], e: "thank someone for something." },
    { t: "m", q: "Choose the correct preposition: 'Let me introduce you ___ my aunt.'", o: ["to", "with", "for", "at"], a: 0, e: "introduce someone to someone." },
    { t: "f", q: "Heavy rain prevented us ______ going out.", a: ["from"], e: "prevent someone from doing." },
    { t: "m", q: "Choose the correct sentence.", o: ["The school provides students with free books.", "The school provides students free books with.", "The school provides with students free books.", "The school provides to students with books."], a: 0, e: "provide someone with something (or provide something for someone)." },
    { t: "m", q: "Choose the correct preposition: 'We congratulated Ravi ___ his new job.'", o: ["on", "for", "of", "at"], a: 0, e: "congratulate on." },
    { t: "f", q: "This photo reminds me ______ our school trip.", a: ["of"], e: "remind someone of something (= make you remember)." },
    { t: "m", q: "Choose the correct sentence.", o: ["Can you explain this problem to me?", "Can you explain me this problem?", "Can you explain this problem me?", "Can you explain to me for this problem?"], a: 0, e: "explain something to someone." }
  ] },

{ id: "u22", level: 3, vp: "Tense", title: "Present Time",
  formula: "Simple present (habit, fact) · Present progressive (now, around now)",
  explain: "Use the simple present for habits, facts and things that are always true. Use the present progressive (am/is/are + -ing) for actions happening now or around now, and for temporary situations. Some verbs (know, like, want, belong, understand, see, hear) are rarely used in the progressive.",
  ex: ["The sun rises in the east.", "Riya goes to school by bus.", "Look! It is snowing in the hills.", "We are studying for our exams this week.", "I understand the question now.", "This bag belongs to Kabir."],
  verbs: "know, like, love, want, need, belong, own, understand, believe, seem, see, hear (usually NOT progressive)",
  watch: [{ bad: "I am knowing the answer.", good: "I know the answer.", note: "'Know' describes a state, so it does not take the progressive." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["Water boils at 100°C.", "Water is boiling at 100°C always.", "Water boil at 100°C.", "Water boiling at 100°C."], a: 0, e: "A scientific fact → simple present." },
    { t: "f", q: "Quiet, please! The baby ______. (sleep)", a: ["is sleeping"], e: "Happening now → present progressive." },
    { t: "m", q: "Choose the correct sentence.", o: ["I want a glass of water.", "I am wanting a glass of water.", "I wanting a glass of water.", "I am want a glass of water."], a: 0, e: "'want' is a state verb." },
    { t: "f", q: "My father ______ (read) the newspaper every morning.", a: ["reads"], e: "Habit → simple present, third person -s." },
    { t: "m", q: "Which is best for a temporary situation?", o: ["My uncle is staying with us this month.", "My uncle stays with us this month.", "My uncle stay with us this month.", "My uncle has stay with us."], a: 0, e: "Temporary → present progressive." },
    { t: "m", q: "Choose the correct sentence.", o: ["Do you hear that noise?", "Are you hearing that noise?", "Do you hearing that noise?", "You are hear that noise?"], a: 0, e: "'hear' (perception) is usually simple." },
    { t: "f", q: "Look! Those boys ______ (climb) the wall!", a: ["are climbing"], e: "Look! signals an action happening now." },
    { t: "m", q: "Choose the sentence about a habit.", o: ["She always forgets her umbrella.", "She is forgetting her umbrella now.", "She forgot her umbrella yesterday.", "She will forget her umbrella."], a: 0, e: "'always' + simple present = habit." }
  ] },

{ id: "u23", level: 3, vp: "Tense", title: "Past Time and the Present Perfect",
  formula: "Simple past (finished time) · Present perfect (past action, present link)",
  explain: "Use the simple past for actions at a finished time (yesterday, last year, in 2020, ago). Use the present perfect (have/has + past participle) when the time is not stated or continues up to now (ever, never, just, already, yet, since, for).",
  ex: ["We visited Shillong last summer.", "I have never seen snow.", "She has just finished her lunch.", "They lived in Delhi for ten years. (They don't live there now.)", "They have lived here since 2019. (They still live here.)", "Have you ever ridden a horse?"],
  verbs: "time words — past: yesterday, ago, last, in 2020, when · perfect: ever, never, just, already, yet, since, for, so far",
  watch: [{ bad: "I have seen him yesterday.", good: "I saw him yesterday.", note: "A finished time word (yesterday) needs the simple past." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["I met her two days ago.", "I have met her two days ago.", "I have meet her two days ago.", "I meeting her two days ago."], a: 0, e: "'ago' = finished time → simple past." },
    { t: "f", q: "Have you ever ______ (eat) a jackfruit?", a: ["eaten"], e: "ever → present perfect: have + past participle (eaten)." },
    { t: "m", q: "Choose 'since' or 'for': 'She has worked here ___ 2018.'", o: ["since", "for", "from", "ago"], a: 0, e: "since + a point of time." },
    { t: "m", q: "Choose 'since' or 'for': 'They have been friends ___ ten years.'", o: ["for", "since", "from", "ago"], a: 0, e: "for + a length of time." },
    { t: "f", q: "Hurry up! The film has already ______. (start)", a: ["started"], e: "already → present perfect: has + past participle." },
    { t: "m", q: "Choose the correct sentence.", o: ["When did you arrive?", "When have you arrived?", "When you have arrived?", "When did you arrived?"], a: 0, e: "A 'when' question asks about a definite time → simple past." },
    { t: "m", q: "'Gandhiji has visited our town.' What is wrong?", o: ["He is no longer alive, so use the simple past: visited.", "Nothing is wrong.", "It should be 'have visited'.", "It should be 'is visiting'."], a: 0, e: "The present perfect links to now; it is odd for a person no longer living." },
    { t: "f", q: "I ______ (not finish) my project yet.", a: ["haven't finished", "have not finished"], e: "yet → present perfect negative." }
  ] },

// ───────────────────────── LEVEL 4 ─────────────────────────
{ id: "u24", level: 4, vp: "VP 4", title: "Consider him (to be) honest",
  formula: "S + V + Object + (to be) + Adjective / Noun",
  explain: "Verbs of opinion and judgement — consider, believe, find, think, suppose, prove, declare, report — can take an object followed by (to be) and a complement. This sounds formal; in everyday English we usually use a that-clause instead. With a that-clause or infinitive as the real object, put 'it' after the verb: I think it wise to wait.",
  ex: ["Everyone considers her (to be) a fine singer.", "The jury believed the witness (to be) truthful.", "I found the old man (to be) very friendly.", "They proved the story (to be) false.", "I think it strange that nobody called.", "We consider it an honour to host you."],
  verbs: "consider, believe, think, find, suppose, imagine, prove, declare, report, know, feel, judge, guess",
  watch: [{ bad: "They knew him a liar.", good: "They knew him to be a liar. / They knew (that) he was a liar.", note: "With 'know', 'to be' cannot be omitted." }],
  qs: [
    { t: "m", q: "Which is the more informal way to say 'I consider him to be careless'?", o: ["I think (that) he is careless.", "I consider careless him.", "I think him careless to be.", "I am considering him careless."], a: 0, e: "Everyday English prefers a that-clause (VP 11)." },
    { t: "f", q: "Do you think ______ wise to travel at night? (preparatory pronoun)", a: ["it"], e: "think it + adjective + to-infinitive." },
    { t: "m", q: "Make it passive: 'People believed him to be a spy.'", o: ["He was believed to be a spy.", "He believed to be a spy.", "He was believed be a spy.", "He was believed a spy to be."], a: 0, e: "Object → subject; 'to be' stays." },
    { t: "m", q: "For a past situation, which form is right? 'We believe the letter ___ by someone else.'", o: ["to have been written", "to be wrote", "to written", "being written to"], a: 0, e: "Past time → perfect infinitive: to have been." },
    { t: "f", q: "The doctors declared the patient ______ danger. (out of)", a: ["out of"], e: "declare + object + prepositional complement." },
    { t: "m", q: "Choose the correct sentence.", o: ["I find it difficult to wake up early.", "I find difficult to wake up early.", "I find it difficult waking up early it.", "I find that difficult to wake up early it."], a: 0, e: "find it + adjective + to-infinitive." },
    { t: "m", q: "Which pattern? 'They proved the theory wrong.'", o: ["VP 4 (object + (to be) + complement)", "VP 19", "VP 2", "VP 21"], a: 0, e: "prove + object + (to be) + adjective." },
    { t: "f", q: "We all consider ______ a pity that the match was cancelled. (pronoun)", a: ["it"], e: "Preparatory 'it' for a that-clause." }
  ] },

{ id: "u25", level: 4, vp: "VP 13–14", title: "Question word + to-infinitive",
  formula: "S + V + (Object) + how / what / where / when / whether + to + verb",
  explain: "After know, learn, wonder, decide, forget, ask, show, teach and tell we can use a question word with a to-infinitive. With show, teach, tell, ask and advise, a person often comes first (VP 14).",
  ex: ["I don't know what to say.", "She learned how to swim last year.", "We couldn't decide where to go.", "Can you show me how to use this app?", "He asked the guard which gate to take.", "I'm not sure whether to laugh or cry."],
  verbs: "know, learn, wonder, decide, forget, remember, discover, find out, show, teach, tell, ask, advise, remind",
  watch: [{ bad: "I don't know how I can to do it.", good: "I don't know how to do it.", note: "Question word + to-infinitive — no subject, no can." },
          { bad: "Tell me why to go.", good: "Tell me why I should go.", note: "'Why' is not used with a to-infinitive." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["Please tell me what to do.", "Please tell me what I to do.", "Please tell me what doing.", "Please tell me to what do."], a: 0, e: "question word + to-infinitive." },
    { t: "f", q: "Could you show me ______ to tie this knot?", a: ["how"], e: "show someone how to do something." },
    { t: "m", q: "Which question word cannot be used with a to-infinitive?", o: ["why", "how", "where", "what"], a: 0, e: "Use a clause instead: why I should…" },
    { t: "m", q: "Which is VP 14 (with a person)?", o: ["She taught me how to knit.", "She learnt how to knit.", "She wondered how to knit.", "She knew how to knit."], a: 0, e: "teach + me + how to…" },
    { t: "f", q: "I can't decide ______ to buy — the blue one or the red one. (question word)", a: ["which"], e: "which + to-infinitive for a choice." },
    { t: "m", q: "Choose the correct sentence.", o: ["She didn't know whether to accept the offer.", "She didn't know if to accept the offer.", "She didn't know whether accept the offer.", "She didn't know to whether accept."], a: 0, e: "Use 'whether', not 'if', before a to-infinitive." },
    { t: "f", q: "Remind me ______ to put the spare key. I keep forgetting. (place)", a: ["where"], e: "where + to-infinitive." },
    { t: "m", q: "Choose the correct sentence.", o: ["Can you advise me which course to choose?", "Can you advise me which course choosing?", "Can you advise to me which course choose?", "Can you advise me which to course choose?"], a: 0, e: "advise + person + which + noun + to-infinitive." }
  ] },

{ id: "u26", level: 4, vp: "VP 15–16", title: "Question word + Clause (indirect questions)",
  formula: "S + V + (Object) + wh-word / if / whether + subject + verb",
  explain: "When a question is put inside another sentence, the word order becomes normal statement order: subject before verb. No question mark is needed unless the whole sentence is a question. Use if or whether for yes/no questions.",
  ex: ["I wonder where she lives.", "Do you know what time it is?", "Ask him whether he will join us.", "Nobody knows why the lights went out.", "Tell me how you solved the puzzle.", "I'm not sure if the shop is open."],
  verbs: "know, wonder, ask, tell, show, see, find out, discover, decide, mind, care, doubt, inform",
  watch: [{ bad: "Can you tell me where is the station?", good: "Can you tell me where the station is?", note: "Inside an indirect question: subject + verb." }],
  qs: [
    { t: "m", q: "Choose the correct sentence.", o: ["I don't know where he has gone.", "I don't know where has he gone.", "I don't know where did he go.", "I don't know where he has gone?"], a: 0, e: "Statement order, no question mark." },
    { t: "m", q: "Choose the correct sentence.", o: ["Could you tell me how much this costs?", "Could you tell me how much does this cost?", "Could you tell me how much costs this?", "Could you tell me how much is costing this?"], a: 0, e: "subject (this) + verb (costs)." },
    { t: "f", q: "She asked me ______ I had eaten. (yes/no word)", a: ["if", "whether"], e: "if / whether for yes/no questions." },
    { t: "m", q: "Report the question: 'Where do you live?' — He asked me…", o: ["where I lived.", "where did I live.", "where do I live.", "where I do live?"], a: 0, e: "Statement order and tense shift." },
    { t: "f", q: "I wonder what ______ (she / be) doing now.", a: ["she is"], e: "Subject before verb: she is." },
    { t: "m", q: "Which is VP 16 (with a person object)?", o: ["Tell me why you are upset.", "I wonder why you are upset.", "I don't know why you are upset.", "Nobody cares why you are upset."], a: 0, e: "tell + me + wh-clause." },
    { t: "m", q: "Choose the correct sentence.", o: ["Do you remember when the school was founded?", "Do you remember when was the school founded?", "Do you remember when did the school found?", "Do you remember the school when was founded?"], a: 0, e: "subject + verb in the indirect question." },
    { t: "f", q: "I don't mind ______ you sit, as long as you are quiet. (place word)", a: ["where"], e: "mind + where-clause." }
  ] },

{ id: "u27", level: 4, vp: "VP 21–22", title: "Preparatory It and There",
  formula: "There + be + indefinite subject · It + be + adjective + to-inf / that-clause",
  explain: "English dislikes starting a sentence with a long or indefinite subject. Use 'There is/are' when the subject is indefinite (a, some, any, no). Use 'It' at the start when the real subject is a to-infinitive, an -ing phrase or a clause, and move that subject to the end.",
  ex: ["There is a crack in the glass.", "There are no buses after nine.", "It is easy to make mistakes.", "It's no use crying over it.", "It seems that the match will be cancelled.", "It was kind of you to wait."],
  verbs: "there is/are/was/were/will be/have been · it is/was/seems/appears/doesn't matter/happened",
  watch: [{ bad: "Is a letter for you on the table.", good: "There is a letter for you on the table.", note: "With an indefinite subject, start with 'There'." },
          { bad: "To learn a language quickly is not easy.", good: "It is not easy to learn a language quickly.", note: "The first is not wrong, but the 'It' pattern is much more natural." }],
  qs: [
    { t: "m", q: "Choose the most natural sentence.", o: ["It is dangerous to swim here.", "To swim here is dangerous it.", "Is dangerous to swim here.", "Swimming here it is dangerous."], a: 0, e: "Preparatory 'it' + adjective + to-infinitive." },
    { t: "f", q: "______ are thirty students in our class.", a: ["There"], e: "Indefinite subject → There are." },
    { t: "m", q: "Choose the correct sentence.", o: ["It doesn't matter whether we win or lose.", "Whether we win or lose doesn't matter it.", "It doesn't matter we win whether or lose.", "There doesn't matter whether we win or lose."], a: 0, e: "It + verb + clause." },
    { t: "m", q: "Choose the correct sentence.", o: ["It's no use arguing with him.", "It's no use to arguing with him.", "There's no use argue with him.", "It's no use argue with him."], a: 0, e: "It's no use / no good + -ing." },
