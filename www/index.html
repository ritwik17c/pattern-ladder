    { t: "f", q: "There's no ______ (deny) that he is talented. (gerund)", a: ["denying"], e: "There's no + -ing = it is impossible to…" },
    { t: "m", q: "Choose the correct sentence.", o: ["It is important for children to sleep well.", "It is important children to sleep well.", "It is important that children to sleep well.", "It is important for children sleeping well."], a: 0, e: "It + adj + for + person + to-infinitive." },
    { t: "m", q: "Choose the best sentence.", o: ["There's a map of India on the wall.", "A map of India is on the wall.", "Is a map of India on the wall.", "On the wall is a map of India it."], a: 0, e: "Hornby notes 'There is…' is preferred with an indefinite subject." },
    { t: "f", q: "It ______ (seem) that nobody knew the answer. (past)", a: ["seemed"], e: "It seemed that…" }
  ] },

{ id: "u28", level: 4, vp: "Tense", title: "Future Time",
  formula: "will · be going to · present progressive · be about to · simple present (timetable)",
  explain: "English has several ways to talk about the future. 'Will' for predictions, promises and sudden decisions. 'Be going to' for plans already made and for what we can see coming. The present progressive for fixed arrangements. The simple present for timetables. 'Be about to' for the very near future.",
  ex: ["I think India will win the match.", "We are going to paint our house next month.", "Look at those clouds — it's going to rain.", "I'm meeting my cousin at five.", "The train leaves at 6.40 tomorrow.", "Hurry! The bus is about to leave."],
  verbs: "will, shall, be going to, be about to, be due to, present progressive, simple present",
  watch: [{ bad: "When I will finish, I will call you.", good: "When I finish, I will call you.", note: "After when, if, before, after, as soon as — use the present for future meaning." }],
  qs: [
    { t: "m", q: "The phone rings. You decide now: …", o: ["I'll get it.", "I'm going to get it.", "I get it.", "I'm getting it tomorrow."], a: 0, e: "A sudden decision → will." },
    { t: "m", q: "Look at the black clouds! It ___.", o: ["is going to rain", "will raining", "rains", "is raining tomorrow"], a: 0, e: "Evidence now → going to." },
    { t: "f", q: "I'll text you as soon as I ______ (reach) home.", a: ["reach"], e: "Present tense after 'as soon as' for future meaning." },
    { t: "m", q: "A fixed arrangement: 'We ___ the dentist on Friday.'", o: ["are seeing", "see always", "saw", "have seen"], a: 0, e: "Present progressive for arrangements." },
    { t: "f", q: "The flight ______ (depart) at 7.15 tomorrow morning. (timetable)", a: ["departs"], e: "Timetable → simple present." },
    { t: "m", q: "Quick! The film is ___ start.", o: ["about to", "going", "due", "will"], a: 0, e: "be about to = very soon." },
    { t: "m", q: "Choose the correct sentence.", o: ["If it rains, we will stay indoors.", "If it will rain, we will stay indoors.", "If it rain, we stay indoors will.", "If it is raining, we would stay indoors will."], a: 0, e: "if + present, will + verb." },
    { t: "f", q: "______ I open the window? (offer — first person)", a: ["Shall"], e: "Shall I…? for offers." }
  ] },

{ id: "u29", level: 4, vp: "AP / NP", title: "Adjective and Noun Patterns",
  formula: "Adjective + to-inf / preposition / that-clause · It is kind of you to…",
  explain: "Learn adjectives together with what follows them: anxious about, afraid of, good at, proud of, interested in, kind of (someone) to, easy to (do), glad that. Nouns too have patterns: an intention of going, a wish to travel, the fact that…",
  ex: ["It was kind of you to help.", "She is good at mathematics.", "I'm glad (that) you came.", "This question is easy to answer.", "He is proud of his daughter.", "She has no intention of resigning."],
  verbs: "afraid of, proud of, fond of, good at, bad at, interested in, anxious about, sorry for, angry with (a person), angry about (a thing), kind of, eager to, certain that",
  watch: [{ bad: "I am interesting in music.", good: "I am interested in music.", note: "-ed adjectives describe how you feel; -ing adjectives describe what causes the feeling." }],
  qs: [
    { t: "m", q: "Choose the correct preposition: 'She is afraid ___ dogs.'", o: ["of", "from", "with", "at"], a: 0, e: "afraid of." },
    { t: "f", q: "It was very thoughtful ______ you to remember my birthday.", a: ["of"], e: "It is kind/thoughtful/clever OF someone to…" },
    { t: "m", q: "Choose the correct sentence.", o: ["The book was boring, so I felt bored.", "The book was bored, so I felt boring.", "The book was boring, so I felt boring.", "The book was bored, so I felt bored."], a: 0, e: "-ing = cause; -ed = feeling." },
    { t: "f", q: "Arjun is very good ______ drawing.", a: ["at"], e: "good at + noun / -ing." },
    { t: "m", q: "Choose the correct sentence.", o: ["This problem is difficult to solve.", "This problem is difficult to solve it.", "This problem is difficult solving it.", "This problem is difficult for solve."], a: 0, e: "Don't add 'it' — the subject is already the object of 'solve'." },
    { t: "m", q: "Choose the correct preposition: 'I'm angry ___ my brother.'", o: ["with", "about", "on", "at the"], a: 0, e: "angry with a person; angry about a thing." },
    { t: "f", q: "Mother was anxious ______ my health.", a: ["about"], e: "anxious about something." },
    { t: "m", q: "Choose the correct sentence.", o: ["He has no intention of leaving.", "He has no intention to leaving.", "He has no intention for leave.", "He has no intention of leave."], a: 0, e: "noun 'intention' + of + -ing (the verb 'intend' takes to-inf)." }
  ] },

{ id: "u30", level: 4, vp: "Adverbs", title: "Adverb Position and Look-alike Adverbs",
  formula: "Mid-position: always, often, never… · Hard / hardly · Late / lately · Near / nearly",
  explain: "Frequency adverbs (always, usually, often, seldom, never) go before the main verb but after 'be' and helper verbs. Some adverbs look like adjectives (fast, hard, late, early, high). Adding -ly can change the meaning completely: hardly = almost not; lately = recently; nearly = almost.",
  ex: ["She always arrives on time.", "He is never late.", "I have often thought about it.", "Prices have risen sharply lately.", "I could hardly hear the speaker.", "The kite flew high above the trees."],
  verbs: "always, usually, often, sometimes, seldom, rarely, never · hard/hardly, late/lately, near/nearly, high/highly, free/freely",
  watch: [{ bad: "She goes always to the temple.", good: "She always goes to the temple.", note: "Frequency adverbs come before the main verb." }],
  qs: [
    { t: "m", q: "Choose the correct order.", o: ["We usually have dinner at eight.", "We have usually dinner at eight.", "Usually we have at eight dinner.", "We have dinner usually eight at."], a: 0, e: "Before the main verb." },
    { t: "m", q: "Choose the correct order.", o: ["She is always cheerful.", "She always is cheerful.", "Always she cheerful is.", "She is cheerful always is."], a: 0, e: "After 'be'." },
    { t: "f", q: "The exam was so tough that I could ______ answer anything. (almost not)", a: ["hardly"], e: "hardly = almost not." },
    { t: "m", q: "'Have you seen any good films ___?' (= recently)", o: ["lately", "late", "later", "latest"], a: 0, e: "lately = recently." },
    { t: "f", q: "He works ______ and deserves the prize. (with great effort)", a: ["hard"], e: "hard (adverb) = with effort." },
    { t: "m", q: "Choose the correct word: 'It is ___ seven o'clock.' (= almost)", o: ["nearly", "near", "nearer", "nearest"], a: 0, e: "nearly = almost." },
    { t: "m", q: "Choose the correct word: 'She is a ___ respected teacher.'", o: ["highly", "high", "height", "higher"], a: 0, e: "highly = very much (before a past participle)." },
    { t: "f", q: "I have ______ seen such a beautiful sunset. (frequency word meaning 'not ever')", a: ["never"], e: "have + never + past participle." }
  ] },

{ id: "u31", level: 5, vp: "Concepts", title: "Requests, Invitations and Suggestions",
  formula: "Could you…? · Would you mind -ing? · Let's… · Why don't we…? · How about -ing? · I suggest that…",
  explain: "We soften requests with could, would, would you mind, please. We make suggestions with Let's, Shall we, Why don't we, How about, What about, and I suggest (that). Invitations often use Would you like to…?",
  ex: ["Could you pass me the water, please?", "Would you mind waiting a moment?", "Let's take a short break, shall we?", "Why don't we ask the librarian?", "How about visiting the zoo on Sunday?", "Would you like to join us for lunch?"],
  verbs: "could, would, will, would you mind, let's, shall we, why don't, how about, what about, suggest, would you like",
  watch: [{ bad: "How about to go for a walk?", good: "How about going for a walk?", note: "How about / What about + -ing." }],
  qs: [
    { t: "m", q: "Which is the most polite request?", o: ["Could you possibly lend me your pen?", "Give me your pen.", "You give pen.", "Pen, now."], a: 0, e: "Could you possibly…? is very polite." },
    { t: "f", q: "Would you mind ______ (turn) the music down?", a: ["turning"], e: "mind + -ing." },
    { t: "m", q: "Choose the correct suggestion.", o: ["Why don't we start now?", "Why we don't start now?", "Why don't we to start now?", "Why not we start now?"], a: 0, e: "Why don't we + base verb? (or: Why not start now?)" },
    { t: "f", q: "How about ______ (order) some pizza?", a: ["ordering"], e: "How about + -ing." },
    { t: "m", q: "Choose the correct sentence.", o: ["I suggest that we leave early.", "I suggest to leave early.", "I suggest us to leave early.", "I suggest we to leave early."], a: 0, e: "suggest that + clause, or suggest + -ing." },
    { t: "m", q: "Accept an invitation politely: 'Would you like to come to our party?'", o: ["I'd love to, thank you.", "I'd love.", "Yes, I like.", "I would love it to."], a: 0, e: "I'd love to (to stands for the infinitive)." },
    { t: "f", q: "Let's play chess, ______ we?", a: ["shall"], e: "Let's…, shall we?" },
    { t: "m", q: "Which is an invitation, not a request?", o: ["Would you like some tea?", "Could you make some tea?", "Will you make some tea?", "Can you make tea?"], a: 0, e: "Would you like…? offers or invites." }
  ] },

{ id: "u32", level: 5, vp: "Concepts", title: "Obligation and Necessity",
  formula: "must · have (got) to · should / ought to · mustn't · needn't / don't have to",
  explain: "Must and have to both express obligation. 'Must' often shows the speaker's own feeling; 'have to' shows an outside rule. 'Mustn't' means it is forbidden, but 'don't have to' and 'needn't' mean it is not necessary. For past obligation, use had to.",
  ex: ["You must wear a helmet when you ride.", "I have to be at school by 7.30.", "You mustn't use your phone during the test.", "You don't have to bring lunch; it will be provided.", "We had to walk because the bus broke down.", "You ought to apologise to her."],
  verbs: "must, have to, have got to, had to, should, ought to, need to, needn't, mustn't, don't have to, be supposed to",
  watch: [{ bad: "Yesterday I must stay at home.", good: "Yesterday I had to stay at home.", note: "'Must' has no past form for obligation; use 'had to'." }],
  qs: [
    { t: "m", q: "'You ___ cross the road when the light is red.' (It is forbidden.)", o: ["mustn't", "don't have to", "needn't", "haven't to"], a: 0, e: "mustn't = not allowed." },
    { t: "m", q: "'Tomorrow is a holiday, so you ___ get up early.' (not necessary)", o: ["don't have to", "mustn't", "must", "have to"], a: 0, e: "don't have to = not necessary." },
    { t: "f", q: "Last week the students ______ submit their projects. (obligation in the past)", a: ["had to"], e: "had to = past obligation." },
    { t: "m", q: "Which is advice rather than a strong rule?", o: ["You should drink more water.", "You must leave now.", "You have to pay the fine.", "You mustn't smoke here."], a: 0, e: "should / ought to = advice." },
    { t: "f", q: "You ought ______ thank your teachers. (one word)", a: ["to"], e: "ought + to-infinitive." },
    { t: "m", q: "Choose the correct sentence.", o: ["Do we have to wear uniform tomorrow?", "Must we to wear uniform tomorrow?", "Do we must wear uniform tomorrow?", "Have we to wearing uniform?"], a: 0, e: "Question with 'have to': Do we have to…?" },
    { t: "m", q: "'You needn't have cooked.' This means…", o: ["You cooked, but it was not necessary.", "You didn't cook, and that's good.", "You must cook.", "You will cook later."], a: 0, e: "needn't have + past participle = did something unnecessary." },
    { t: "f", q: "Passengers are ______ to fasten their seat belts. (expected, by rule: be ___ to)", a: ["supposed", "required"], e: "be supposed to / be required to." }
  ] },

{ id: "u33", level: 5, vp: "Concepts", title: "Permission, Possibility and Probability",
  formula: "can / may / could (permission) · may / might / could (possibility) · must / can't (logical certainty) · be likely to",
  explain: "Ask permission with Can I…? (informal), Could I…? (polite) or May I…? (formal). For possibility use may, might or could. When you are almost sure, use must (= surely true) or can't (= surely not true). 'Be likely to' and 'There's a good chance that' express probability.",
  ex: ["May I come in, sir?", "Could I borrow your dictionary?", "It may rain this evening.", "She might be at the library.", "He must be tired after that long journey.", "That can't be true!"],
  verbs: "can, could, may, might, must, can't, be allowed to, be likely to, probably, perhaps, possibly",
  watch: [{ bad: "He mustn't be at home; the lights are off.", good: "He can't be at home; the lights are off.", note: "For logical 'surely not', use can't, not mustn't." }],
  qs: [
    { t: "m", q: "Which is the most formal way to ask permission?", o: ["May I leave early?", "Can I leave early?", "I leave early, OK?", "Leave early I can?"], a: 0, e: "May I…? is formal." },
    { t: "m", q: "'She has worked all day. She ___ be exhausted.' (I'm sure.)", o: ["must", "can't", "mustn't", "needn't"], a: 0, e: "must = logical certainty." },
    { t: "m", q: "'He left an hour ago. He ___ still be here.' (I'm sure he isn't.)", o: ["can't", "mustn't", "must", "should"], a: 0, e: "can't = logical impossibility." },
    { t: "f", q: "Take an umbrella. It ______ rain later. (possibility, 5 letters)", a: ["might", "could"], e: "might / could = possible." },
    { t: "m", q: "Choose the correct sentence.", o: ["The train is likely to be late.", "The train is likely be late.", "The train is likely being late.", "The train likely to is late."], a: 0, e: "be likely to + verb." },
    { t: "f", q: "You ______ not use a calculator in this exam. (formal prohibition: may)", a: ["may"], e: "may not = not permitted (formal)." },
    { t: "m", q: "'He might have missed the bus.' This means…", o: ["Perhaps he missed the bus.", "He certainly missed the bus.", "He will miss the bus.", "He didn't miss the bus."], a: 0, e: "might have + past participle = past possibility." },
    { t: "f", q: "Were you ______ to use phones at the camp? (permission: be ___ to)", a: ["allowed", "permitted"], e: "be allowed to." }
  ] },

{ id: "u34", level: 5, vp: "Concepts", title: "Ability and Achievement",
  formula: "can / could · be able to · managed to · succeeded in -ing",
  explain: "Can and could express general ability. For a single success in the past, use was able to, managed to or succeeded in -ing — not could. For future ability use will be able to.",
  ex: ["My little brother can read already.", "When I was six, I could swim.", "After many tries, he managed to open the jar.", "Despite the traffic, we were able to reach on time.", "She succeeded in solving the puzzle.", "Soon you will be able to speak English fluently."],
  verbs: "can, could, be able to, manage to, succeed in, fail to, couldn't",
  watch: [{ bad: "The fire spread quickly, but everyone could escape.", good: "…but everyone was able to / managed to escape.", note: "For one particular success in the past, avoid 'could'. ('Couldn't' is fine for failure.)" }],
  qs: [
    { t: "m", q: "One particular success: 'The climbers ___ reach the top yesterday.'", o: ["managed to", "could", "can", "are able"], a: 0, e: "managed to / were able to for a single achievement." },
    { t: "f", q: "I ______ (be able) to finish the race last Sunday.", a: ["was able"], e: "was able to = achieved." },
    { t: "m", q: "General ability in the past: 'My grandfather ___ run very fast when he was young.'", o: ["could", "managed to", "succeeded", "was succeeding"], a: 0, e: "could = general past ability." },
    { t: "f", q: "She succeeded ______ getting a place in the team.", a: ["in"], e: "succeed in + -ing." },
    { t: "m", q: "Future ability: 'Next year I ___ drive.'", o: ["will be able to", "can will", "will can", "could will"], a: 0, e: "will be able to (can has no future form)." },
    { t: "m", q: "Choose the correct sentence.", o: ["I tried hard but couldn't lift the box.", "I tried hard but couldn't to lift the box.", "I tried hard but not could lift the box.", "I tried hard but couldn't lifting the box."], a: 0, e: "couldn't + bare infinitive (failure is fine with could)." },
    { t: "f", q: "Despite the noise, he managed ______ (sleep).", a: ["to sleep"], e: "manage + to-infinitive." },
    { t: "m", q: "'He failed to notice the sign.' This means…", o: ["He didn't notice the sign.", "He noticed the sign.", "He wanted to notice.", "He noticed and fell."], a: 0, e: "fail to = not do (what was expected)." }
  ] },

{ id: "u35", level: 5, vp: "Concepts", title: "Wishes, Hopes and Preferences",
  formula: "I hope (that) + present/will · I wish + past / past perfect / would · would rather + bare inf · prefer X to Y",
  explain: "'Hope' is for things that are possible. 'Wish' is for things that are unreal or unlikely: wish + past (now), wish + past perfect (regret about the past), wish + would (complaint about someone's behaviour). For preferences use would rather + bare infinitive, or prefer -ing to -ing.",
  ex: ["I hope you pass the test.", "I wish I knew the answer.", "She wishes she had studied harder.", "I wish you would stop interrupting.", "I'd rather walk than take the bus.", "He prefers reading to watching television."],
  verbs: "hope, wish, would rather, would sooner, prefer, would prefer, if only",
  watch: [{ bad: "I wish I can fly.", good: "I wish I could fly.", note: "After 'wish' (unreal present), move back one tense: can → could." }],
  qs: [

</script>
<script>
(function(){
"use strict";
const LEVELS = window.LEVELS, UNITS = window.UNITS;
const $ = (s, el=document) => el.querySelector(s);
const view = $("#view");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (a,n) => shuffle(a).slice(0,n);

/* ---------- storage (safe) ---------- */
const KEY = "poe.v1";
const blank = () => ({ units:{}, xp:0, streak:0, best:0, last:null, days:{}, mistakes:[], goal:20, unlockAll:false, theme:"system", answered:0, correct:0 });
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function applyTheme(){ const r=document.documentElement; if(S.theme==="system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",S.theme); }
applyTheme();

const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const yesterday = () => { const d=new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function touchStreak(){
  const t=today(); if (S.last===t) return;
  S.streak = (S.last===yesterday()) ? S.streak+1 : 1;
  S.best = Math.max(S.best, S.streak); S.last=t;
}
function currentStreak(){ return (S.last===today()||S.last===yesterday()) ? S.streak : 0; }
function todayCount(){ return S.days[today()]||0; }

/* ---------- unlocking ---------- */
const PASS = 0.7;
function unitIndex(id){ return UNITS.findIndex(u=>u.id===id); }
function isDone(u){ const r=S.units[u.id]; return r && r.best>=PASS; }
function isOpen(u){
  if (S.unlockAll) return true;
  const i = unitIndex(u.id); if (i===0) return true;
  return isDone(UNITS[i-1]) || !!S.units[u.id];
}
function starsFor(score){ return score>=0.9?3:score>=0.7?2:score>=0.5?1:0; }
function starSvg(on, size){ return `<svg viewBox="0 0 24 24" ${size?`width="${size}" height="${size}"`:""} aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="${on?"#e9a521":"none"}" stroke="${on?"#e9a521":"currentColor"}" stroke-width="1.6" opacity="${on?1:.45}"/></svg>`; }
function currentUnit(){ return UNITS.find(u=>isOpen(u)&&!isDone(u)) || UNITS[UNITS.length-1]; }

/* ---------- question building ---------- */
function norm(s){ return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"]+/g," ").replace(/\s+/g," ").trim(); }
function cleanEx(s){ return s.replace(/\s*\([^)]*\)\s*/g," ").replace(/\s+/g," ").trim(); }
function buildable(s){ const c=cleanEx(s); return !/[…\/—:]/.test(c) && c.split(" ").length>=4 && c.split(" ").length<=10; }
const isVP = u => /^VP \d/.test(u.vp);

function qKey(uid, i){ return uid+":"+i; }
function getQ(key){
  const [uid, i] = key.split(":"); const u = UNITS.find(x=>x.id===uid); if(!u) return null;
  if (i.startsWith("b")) return makeBuild(u, +i.slice(1));
  if (i.startsWith("p")) return makeWhich(u, +i.slice(1));
  const q = u.qs[+i]; return q ? Object.assign({key, unit:u}, q) : null;
}
function makeBuild(u, k){
  const pool = u.ex.map((s,idx)=>({s,idx})).filter(x=>buildable(x.s));
  if (!pool.length) return null;
  const item = pool.find(x=>x.idx===k) || pool[0];
  const sentence = cleanEx(item.s);
  const words = sentence.split(" ");
  const sig = w => w.map(x=>norm(x)).sort().join("|");
  const accepts = u.ex.map(cleanEx).filter(s=>sig(s.split(" "))===sig(words)).map(norm);
  return { key:qKey(u.id,"b"+item.idx), unit:u, t:"b", q:"Build the sentence. Tap the words in the right order.", words, answer:sentence, accepts, e:`Pattern: ${u.formula}` };
}
function makeWhich(u, k){
  if (!isVP(u)) return null;
  const ex = u.ex[k] || u.ex[0];
  const others = pick(UNITS.filter(x=>isVP(x)&&x.id!==u.id&&x.formula!==u.formula), 3);
  const o = [u, ...others].map(x=>`${x.vp} · ${x.formula}`);
  return { key:qKey(u.id,"p"+k), unit:u, t:"m", label:"Which pattern?", q:`Which pattern does this sentence follow?<br><em>“${esc(cleanEx(ex))}”</em>`, raw:true, o, a:0, e:`${u.vp}: ${u.title}.` };
}
function unitQuestions(u){
  const keys = u.qs.map((_,i)=>qKey(u.id,i));
  const bIdx = u.ex.map((s,i)=>i).filter(i=>buildable(u.ex[i]));
  pick(bIdx,2).forEach(i=>keys.push(qKey(u.id,"b"+i)));
  if (isVP(u)) keys.push(qKey(u.id,"p"+Math.floor(Math.random()*u.ex.length)));
  return shuffle(keys).slice(0,10);
}
function dailyQuestions(){
  const open = UNITS.filter(isOpen);
  const learned = open.filter(u=>S.units[u.id]);
  const base = learned.length ? learned : [open[0]];
  const keys = [];
  pick(S.mistakes, 4).forEach(k=>keys.push(k));
  const cur = currentUnit();
  let guard=0;
  while (keys.length<10 && guard++<200){
    const u = Math.random()<0.3 && S.units[cur.id] ? cur : base[Math.floor(Math.random()*base.length)];
    const r = Math.random();
    let k;
    if (r<0.18){ const b=u.ex.map((s,i)=>i).filter(i=>buildable(u.ex[i])); if(!b.length) continue; k=qKey(u.id,"b"+b[Math.floor(Math.random()*b.length)]); }
    else if (r<0.28 && isVP(u)) k=qKey(u.id,"p"+Math.floor(Math.random()*u.ex.length));
    else k=qKey(u.id, Math.floor(Math.random()*u.qs.length));
    if (!keys.includes(k)) keys.push(k);
  }
  return shuffle(keys);
}

/* ---------- speech ---------- */
let voice=null;
function loadVoice(){ try{ const vs=speechSynthesis.getVoices(); voice = vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/en[-_]IN/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }catch(e){} }
try{ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }catch(e){}
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); if(voice) u.voice=voice; u.lang=voice?voice.lang:"en-GB"; u.rate=.92; speechSynthesis.speak(u); }catch(e){ toast("Listening is not available on this device."); } }
const sayIcon = `<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ---------- navigation ---------- */
let stack=[];
function go(fn, push=true){ if(push) stack.push(fn); render(fn); }
function back(){ if (quiz && !quiz.finished && !confirmLeave()) return; stack.pop(); render(stack[stack.length-1]||home); }
let leaveArmed=false;
function confirmLeave(){ if(leaveArmed){ leaveArmed=false; quiz=null; return true; } leaveArmed=true; toast("Tap back again to leave this practice."); setTimeout(()=>leaveArmed=false,2500); return false; }
function render(fn){ fn(); $("#backBtn").hidden = stack.length<=1; $("#streakNum").textContent=currentStreak(); window.scrollTo(0,0); }
function setTab(t){ document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===t?"page":"false")); }
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{
  if (quiz && !quiz.finished && !confirmLeave()) return; quiz=null;
  const t=b.dataset.tab; stack=[]; go({home, daily:dailyIntro, ref:reference, me:progress}[t]);
}));
$("#backBtn").addEventListener("click", back);

/* ---------- HOME ---------- */
function home(){
  setTab("home");
  const cur = currentUnit(); const done = UNITS.filter(isDone).length;
  const tc = todayCount(); const pct = Math.min(100, Math.round(tc/S.goal*100));
  let html = `<div class="stack">
  <section class="card today">
    <div class="eyebrow" style="color:inherit;opacity:.8">Today</div>
    <h2>${tc>=S.goal ? "Goal reached. Well done!" : "Ten minutes of patterns"}</h2>
    <div class="stats">
      <div class="stat"><b>${currentStreak()}</b><span>day streak</span></div>
      <div class="stat"><b>${S.xp}</b><span>points</span></div>
      <div class="stat"><b>${done}/${UNITS.length}</b><span>units passed</span></div>
    </div>
    <div class="row" style="margin-bottom:6px"><span class="muted" style="font-size:.85rem;flex:1">${tc} of ${S.goal} answers today</span></div>
    <div class="goalbar" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <div class="stack" style="margin-top:14px;gap:8px">
      <button class="btn" id="contBtn">Continue: ${esc(cur.title)}</button>
      <button class="btn ghost" id="dailyBtn">Mixed daily practice</button>
    </div>
  </section>`;
  for (const L of LEVELS){
    const us = UNITS.filter(u=>u.level===L.id);
    const passed = us.filter(isDone).length;
    html += `<section class="level" aria-labelledby="lv${L.id}">
      <header><div class="badge" style="background:${L.colour}">${L.id}</div>
      <div style="flex:1;min-width:0"><div class="eyebrow">${esc(L.tag)} · ${passed}/${us.length}</div><h3 id="lv${L.id}">${esc(L.name)}</h3><p>${esc(L.blurb)}</p></div></header>
      <ul class="units">`;
    for (const u of us){
      const open=isOpen(u), r=S.units[u.id], st=r?starsFor(r.best):0;
      html += `<li><button class="unit" data-u="${u.id}" ${open?"":"disabled"}>
        <span class="vp">${esc(u.vp)}</span>
        <span class="t"><b>${esc(u.title)}</b><span>${esc(u.formula)}</span></span>
        ${open ? `<span class="stars" aria-label="${st} of 3 stars">${starSvg(st>=1)}${starSvg(st>=2)}${starSvg(st>=3)}</span>`
               : `<span class="lock" aria-label="Locked"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>`}
      </button></li>`;
    }
    html += `</ul></section>`;
  }
  html += `<p class="muted" style="font-size:.82rem;text-align:center">Score 70% or more in a unit to unlock the next one.</p></div>`;
  view.innerHTML = html;
  $("#contBtn").onclick = () => go(()=>lesson(cur));
  $("#dailyBtn").onclick = () => go(dailyIntro);
  view.querySelectorAll(".unit").forEach(b=>b.onclick=()=>{ const u=UNITS.find(x=>x.id===b.dataset.u); go(()=>lesson(u)); });
}

/* ---------- LESSON ---------- */
function lesson(u){
  setTab("home");
  const L = LEVELS.find(l=>l.id===u.level);
  const slots = u.formula.split(/\s+\+\s+/).map(s=>`<span class="slot">${esc(s)}</span>`).join("");
  view.innerHTML = `<div class="stack">
    <div><div class="eyebrow" style="color:${L.colour}">Level ${L.id} · ${esc(L.name)} · ${esc(u.vp)}</div>
    <h1 style="font-size:1.75rem;margin-top:4px">${esc(u.title)}</h1>
    <div class="formula" aria-label="Pattern">${slots}</div></div>
    <section class="card"><p style="margin:0">${esc(u.explain)}</p></section>
    <section class="card stack" style="gap:10px"><div class="eyebrow">Examples</div>
      <ul class="exlist">${u.ex.map(s=>`<li><span>${esc(s)}</span><button class="say" data-say="${esc(cleanEx(s))}" aria-label="Listen">${sayIcon}</button></li>`).join("")}</ul></section>
    <section class="card"><div class="eyebrow">Verbs and words often used this way</div><p class="verbs" style="margin:6px 0 0">${esc(u.verbs)}</p></section>
    ${(u.watch||[]).map(w=>`<section class="watch"><div class="row" style="gap:6px"><span class="sign" aria-hidden="true">&#9888;</span><b>Watch out</b></div>
      <div class="bad">${esc(w.bad)}</div><div class="good">${esc(w.good)}</div><div class="muted" style="font-size:.9rem;margin-top:4px">${esc(w.note)}</div></section>`).join("")}
    <div class="dock"><button class="btn" id="startQ">Practise this pattern (10 questions)</button></div>
  </div>`;
  view.querySelectorAll(".say").forEach(b=>b.onclick=()=>speak(b.dataset.say));
  $("#startQ").onclick = () => startQuiz(unitQuestions(u), {mode:"unit", unit:u});
}

/* ---------- QUIZ ---------- */
let quiz=null;
function startQuiz(keys, meta){
  const qs = keys.map(getQ).filter(Boolean);
  quiz = { qs, i:0, right:0, meta, finished:false, wrongKeys:[] };
  if (stack[stack.length-1]===results) stack.pop();
  go(question);
}
function question(){
  const z=quiz, q=z.qs[z.i];
  const label = q.label || ({m:"Choose the answer", f:"Fill in the blank", b:"Build the sentence"}[q.t]);
  let body="";
  if (q.t==="m"){
    q._order = q._order || shuffle(q.o.map((_,i)=>i));
    body = `<div class="opts">${q._order.map(i=>`<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join("")}</div>`;
  } else if (q.t==="f"){
    body = `<input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer">`;
  } else {
    q._bank = q._bank || shuffle(q.words.map((w,i)=>({w,i})));
    body = `<div class="build-line" id="line" aria-label="Your sentence"></div>
      <div class="bank" id="bank">${q._bank.map(x=>`<button class="word" data-i="${x.i}">${esc(x.w)}</button>`).join("")}</div>`;
  }
  const qtext = q.raw ? q.q : esc(q.q).replace(/_{3,}/g,"<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>");
  view.innerHTML = `<div class="stack pop">
    <div class="row"><div class="progress" aria-hidden="true"><i style="width:${z.i/z.qs.length*100}%"></i></div>
      <span class="muted" style="font-variant-numeric:tabular-nums;font-size:.85rem">${z.i+1}/${z.qs.length}</span></div>
    <div><div class="qtype">${esc(label)} <span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">· ${esc(q.unit.vp)}</span></div>
    <p class="qtext">${qtext}</p></div>
    ${body}
    <div id="fb"></div>
    <div class="dock"><button class="btn" id="checkBtn" disabled>Check</button></div>
  </div>`;
  const check=$("#checkBtn");
  let chosen=null;
  if (q.t==="m"){
    view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ view.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); chosen=+b.dataset.i; check.disabled=false; });
  } else if (q.t==="f"){
    const inp=$("#ans"); inp.focus({preventScroll:true});
    inp.oninput=()=>{ check.disabled=!inp.value.trim(); };
    inp.onkeydown=e=>{ if(e.key==="Enter"&&!check.disabled) check.click(); };
  } else {
    const line=$("#line"), picked=[];
    const draw=()=>{ line.innerHTML=picked.map((x,k)=>`<button class="word" data-k="${k}">${esc(q.words[x])}</button>`).join(""); check.disabled = picked.length!==q.words.length;
      line.querySelectorAll(".word").forEach(b=>b.onclick=()=>{ const idx=picked.splice(+b.dataset.k,1)[0]; $(`#bank .word[data-i="${idx}"]`).disabled=false; draw(); }); };
    view.querySelectorAll("#bank .word").forEach(b=>b.onclick=()=>{ picked.push(+b.dataset.i); b.disabled=true; draw(); });
    q._picked=picked;
  }
  check.onclick=()=>{
    if (check.dataset.next){ next(); return; }
    let ok=false, shown="";
    if (q.t==="m"){
      ok = chosen===q.a;
      view.querySelectorAll(".opt").forEach(b=>{ const i=+b.dataset.i; b.disabled=true; if(i===q.a) b.classList.add("right"); else if(i===chosen) b.classList.add("wrong"); });
      shown = q.o[q.a];
    } else if (q.t==="f"){
      const inp=$("#ans"); const v=norm(inp.value);
      ok = q.a.some(a=>norm(a)===v); inp.disabled=true; inp.classList.add(ok?"right":"wrong");
      shown = q.a[0];
    } else {
      const s = norm(q._picked.map(i=>q.words[i]).join(" "));
      ok = q.accepts.includes(s);
      $("#line").classList.add(ok?"right":"wrong");
      view.querySelectorAll(".word").forEach(b=>b.disabled=true);
      shown = q.answer;
    }
    record(q, ok);
    $("#fb").innerHTML = `<div class="feedback ${ok?"right":"wrong"} pop" role="status"><b>${ok?pickPraise():"Not quite."}</b>
      ${ok?"":`<div>Answer: <strong>${esc(shown)}</strong></div>`}<div class="muted" style="font-size:.92rem">${esc(q.e||"")}</div>
      ${q.t==="b"?`<button class="say" style="margin-top:6px" aria-label="Listen" id="sayAns">${sayIcon}</button>`:""}</div>`;
    const sa=$("#sayAns"); if(sa) sa.onclick=()=>speak(q.answer);
    check.textContent = quiz.i===quiz.qs.length-1 ? "See results" : "Next"; check.dataset.next="1"; check.disabled=false; check.focus({preventScroll:true});
  };
}
const praise=["Correct!","Well done!","Exactly right.","Good work!","Spot on."];
function pickPraise(){ return praise[Math.floor(Math.random()*praise.length)]; }
function record(q, ok){
  S.answered++; touchStreak(); S.days[today()]=(S.days[today()]||0)+1;
  if (ok){ quiz.right++; S.correct++; S.xp+=10; S.mistakes=S.mistakes.filter(k=>k!==q.key); }
  else { quiz.wrongKeys.push(q.key); if(!S.mistakes.includes(q.key)) S.mistakes.push(q.key); if(S.mistakes.length>60) S.mistakes.shift(); }
  save(); $("#streakNum").textContent=currentStreak();
}
function next(){ quiz.i++; if (quiz.i>=quiz.qs.length) { quiz.finished=true; stack.pop(); go(results); } else render(question); }

function results(){
  const z=quiz, score=z.right/z.qs.length, st=starsFor(score);
  let unlocked=null;
  if (z.meta.mode==="unit"){
    const u=z.meta.unit, was=isDone(u), r=S.units[u.id]||{best:0,tries:0};
    r.best=Math.max(r.best,score); r.tries++; r.lastDate=today(); S.units[u.id]=r; save();
    const i=unitIndex(u.id); if(!was && isDone(u) && UNITS[i+1]) unlocked=UNITS[i+1];
  }
  const msg = score>=0.9?"Excellent!":score>=0.7?"Pattern passed.":score>=0.5?"Nearly there.":"Keep practising.";
  view.innerHTML = `<div class="stack pop" style="text-align:center">
    <div class="eyebrow">${z.meta.mode==="unit"?esc(z.meta.unit.vp+" · "+z.meta.unit.title):"Daily practice"}</div>
    <div class="bigstars" aria-label="${st} of 3 stars">${starSvg(st>=1)}${starSvg(st>=2)}${starSvg(st>=3)}</div>
    <div class="big">${z.right}/${z.qs.length}</div>
    <h2>${msg}</h2>
    <p class="muted" style="margin:0">+${z.right*10} points · ${todayCount()} answers today</p>
    ${unlocked?`<div class="card" style="text-align:left"><div class="eyebrow">Unlocked</div><b>${esc(unlocked.vp)} · ${esc(unlocked.title)}</b></div>`:""}
    ${z.meta.mode==="unit"&&score<PASS?`<p class="muted" style="margin:0">Score 7 or more to unlock the next unit. Read the examples again, then retry.</p>`:""}
    ${z.wrongKeys.length?`<p class="muted" style="margin:0;font-size:.9rem">The ${z.wrongKeys.length} question${z.wrongKeys.length>1?"s":""} you missed will come back in your daily practice.</p>`:""}
    <div class="stack" style="gap:8px">
      ${unlocked?`<button class="btn" id="nextUnit">Start next unit</button>`:""}
      ${z.meta.mode==="unit"?`<button class="btn ${unlocked?"ghost":""}" id="retry">Try again</button>`:`<button class="btn" id="again">Another round</button>`}
      <button class="btn ghost" id="toHome">Back to the path</button>
    </div></div>`;
  const nu=$("#nextUnit"); if(nu) nu.onclick=()=>{ stack=[home]; go(()=>lesson(unlocked)); };
  const rt=$("#retry"); if(rt) rt.onclick=()=>startQuiz(unitQuestions(z.meta.unit), z.meta);
  const ag=$("#again"); if(ag) ag.onclick=()=>startQuiz(dailyQuestions(), {mode:"daily"});
  $("#toHome").onclick=()=>{ quiz=null; stack=[]; go(home); };
}

/* ---------- DAILY ---------- */
function dailyIntro(){
  setTab("daily");
  const learned = UNITS.filter(u=>S.units[u.id]).length;
  const tc=todayCount();
  view.innerHTML = `<div class="stack">
    <h1 style="font-size:1.75rem">Today's practice</h1>
    <section class="card stack" style="gap:8px">
      <p style="margin:0">Ten mixed questions from the patterns you have studied${S.mistakes.length?`, including up to four you got wrong before`:""}.</p>
      <div class="goalbar" style="background:var(--line)"><i style="width:${Math.min(100,tc/S.goal*100)}%;background:var(--accent)"></i></div>
      <span class="muted" style="font-size:.85rem">${tc} of ${S.goal} answers today · ${S.mistakes.length} to review</span>
    </section>
    ${learned?"":`<section class="watch"><b>Start with a unit first.</b><div class="muted" style="font-size:.9rem">Daily practice draws on units you have tried. Until then it uses Unit 1.</div></section>`}
    <button class="btn" id="goDaily">Start (10 questions)</button>
    ${S.mistakes.length?`<button class="btn ghost" id="goReview">Review my mistakes only</button>`:""}
    <section class="card"><div class="eyebrow">Daily goal</div>
      <div class="seg" style="margin-top:8px" role="group" aria-label="Daily goal">${[10,20,30,50].map(n=>`<button data-g="${n}" aria-pressed="${S.goal===n}">${n} answers</button>`).join("")}</div></section>
  </div>`;
  $("#goDaily").onclick=()=>startQuiz(dailyQuestions(),{mode:"daily"});
  const gr=$("#goReview"); if(gr) gr.onclick=()=>startQuiz(pick(S.mistakes,10),{mode:"daily"});
  view.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ S.goal=+b.dataset.g; save(); render(dailyIntro); });
}

/* ---------- REFERENCE ---------- */
const VPREF = [
 [1,"S + V + Object","We planted a mango tree.","u03"],[2,"S + V + (not) to-inf","Mira hopes to become a nurse.","u07"],
 [3,"S + V + Object + (not) to-inf","The guide told us to keep together.","u15"],[4,"S + V + Object + (to be) + complement","The judges declared her (to be) the winner.","u24"],
 [5,"S + V + Object + bare inf","Let the children play.","u16"],[6,"S + V + Object + -ing","I heard a dog barking.","u17"],
 [7,"S + V + Object + adjective","The rain made the road slippery.","u13"],[8,"S + V + Object + noun","They chose Kiran captain.","u14"],
 [9,"S + V + Object + past participle","We had the fan repaired.","u18"],[10,"S + V + Object + adverbial","Hang your bag on the hook.","u11"],
 [11,"S + V + that-clause","I believe that you are right.","u19"],[12,"S + V + Object + that-clause","He assured me that all was well.","u20"],
 [13,"S + V + wh-word + to-inf","I don't know where to begin.","u25"],[14,"S + V + Object + wh-word + to-inf","She taught us how to fold paper boats.","u25"],
 [15,"S + V + wh-word / if + clause","I wonder who left this note.","u26"],[16,"S + V + Object + wh-word + clause","Ask her when the bus leaves.","u26"],
 [17,"S + V + -ing (gerund)","He has stopped complaining.","u08"],[18,"S + V + Object + prep + Object","I thanked her for the advice.","u21"],
 [19,"S + V + Indirect Obj + Direct Obj","Pass me the salt, please.","u04"],[20,"S + V + (for) + distance / time","The concert lasted three hours.","u12"],
 [21,"S + V","The guests have left.","u01"],[22,"S + V + complement","The sky grew dark.","u02"],
 [23,"S + V + adverbial","My grandparents live near the river.","u05"],[24,"S + V + prep + Object","Wait for me at the gate.","u10"],
 [25,"S + V + to-inf (purpose / result)","She paused to take a breath.","u09"]];
let refFilter="all";
function reference(){
  setTab("ref");
  const rows = VPREF.filter(r=>refFilter==="all"||(refFilter==="t"?r[0]<=19:r[0]>=20));
  view.innerHTML = `<div class="stack">
    <div><h1 style="font-size:1.75rem">The 25 Verb Patterns</h1>
    <p class="muted" style="margin:4px 0 0">Patterns 1–19 have a direct object (transitive). Patterns 20–25 have none (intransitive).</p></div>
    <div class="seg" role="group" aria-label="Filter">${[["all","All 25"],["t","Transitive 1–19"],["i","Intransitive 20–25"]].map(([k,l])=>`<button data-f="${k}" aria-pressed="${refFilter===k}">${l}</button>`).join("")}</div>
    <section class="card" style="padding:4px 8px"><div class="tablewrap"><table class="ref">
      <thead><tr><th>VP</th><th>Pattern and example</th><th></th></tr></thead><tbody>
      ${rows.map(r=>{ const u=UNITS.find(x=>x.id===r[3]); const open=isOpen(u);
        return `<tr><td>${r[0]}</td><td><span class="fm">${esc(r[1])}</span>${esc(r[2])}</td>
        <td><button data-u="${r[3]}" ${open?"":"disabled style=\"opacity:.45\""} aria-label="Open VP ${r[0]} lesson">${open?"Learn":"Locked"}</button></td></tr>`; }).join("")}
      </tbody></table></div></section>
    <p class="muted" style="font-size:.82rem">Pattern numbers follow A. S. Hornby, <em>A Guide to Patterns and Usage in English</em> (OUP). All example sentences in this app are newly written.</p>
  </div>`;
  view.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ refFilter=b.dataset.f; render(reference); });
  view.querySelectorAll(".ref button[data-u]").forEach(b=>b.onclick=()=>{ const u=UNITS.find(x=>x.id===b.dataset.u); go(()=>lesson(u)); });
}

/* ---------- PROGRESS ---------- */
let resetArmed=false;
function progress(){
  setTab("me");
  const acc = S.answered ? Math.round(S.correct/S.answered*100) : 0;
  const days=[]; for(let k=6;k>=0;k--){ const d=new Date(); d.setDate(d.getDate()-k); const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); days.push({l:d.toLocaleDateString("en-GB",{weekday:"short"}).slice(0,2), n:S.days[key]||0}); }
  const maxD=Math.max(S.goal,...days.map(d=>d.n));
  view.innerHTML = `<div class="stack">
    <h1 style="font-size:1.75rem">Your progress</h1>
    <section class="card"><div class="stats" style="margin:0">
      <div class="stat" style="background:var(--bg)"><b>${currentStreak()}</b><span class="muted">day streak</span></div>
      <div class="stat" style="background:var(--bg)"><b>${S.best}</b><span class="muted">best streak</span></div>
      <div class="stat" style="background:var(--bg)"><b>${acc}%</b><span class="muted">accuracy</span></div></div></section>
    <section class="card"><div class="eyebrow">Last 7 days</div>
      <svg viewBox="0 0 280 120" width="100%" role="img" aria-label="Answers per day for the last 7 days" style="margin-top:8px;max-width:100%">
        <line x1="0" x2="280" y1="${100-(S.goal/maxD)*86}" y2="${100-(S.goal/maxD)*86}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>
        <text x="278" y="${96-(S.goal/maxD)*86}" text-anchor="end" font-size="9" fill="var(--muted)">goal ${S.goal}</text>
        ${days.map((d,i)=>{ const h=d.n/maxD*86, x=i*40+8; return `<rect x="${x}" y="${100-h}" width="24" height="${h}" rx="4" fill="var(--accent)" opacity="${d.n>=S.goal?1:.55}"/>
          <text x="${x+12}" y="114" text-anchor="middle" font-size="10" fill="var(--muted)">${d.l}</text>${d.n?`<text x="${x+12}" y="${96-h}" text-anchor="middle" font-size="9" fill="var(--ink)">${d.n}</text>`:""}`; }).join("")}
      </svg></section>
    <section class="card"><div class="eyebrow" style="margin-bottom:10px">Levels</div><div class="bars">
      ${LEVELS.map(L=>{ const us=UNITS.filter(u=>u.level===L.id), d=us.filter(isDone).length;
        return `<div class="b"><span>${esc(L.name)}</span><span class="track"><i style="width:${d/us.length*100}%;background:${L.colour}"></i></span><span class="n">${d}/${us.length}</span></div>`; }).join("")}
    </div></section>
    <section class="card">
      <div class="toggle"><div><p><b>Teacher mode</b></p><p class="muted" style="font-size:.85rem">Open every unit without passing the earlier ones.</p></div>
        <button class="switch" id="swUnlock" role="switch" aria-checked="${S.unlockAll}" aria-label="Teacher mode"></button></div>
      <div class="toggle"><div><p><b>Appearance</b></p></div>
        <div class="seg" role="group" aria-label="Appearance">${[["system","Auto"],["light","Light"],["dark","Dark"]].map(([k,l])=>`<button data-th="${k}" aria-pressed="${S.theme===k}">${l}</button>`).join("")}</div></div>
      <div class="toggle"><div><p><b>Start again</b></p><p class="muted" style="font-size:.85rem">Clears all stars, points and streaks on this device.</p></div>
        <button class="btn ghost" id="reset" style="width:auto;padding:8px 14px;color:var(--bad);border-color:var(--bad)">Reset</button></div>
    </section>
    <p class="muted" style="font-size:.82rem">Progress is saved on this device only.</p>
  </div>`;
  $("#swUnlock").onclick=()=>{ S.unlockAll=!S.unlockAll; save(); render(progress); toast(S.unlockAll?"All units open":"Units unlock in order"); };
  view.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{ S.theme=b.dataset.th; save(); applyTheme(); render(progress); });
  $("#reset").onclick=e=>{ if(!resetArmed){ resetArmed=true; e.target.textContent="Tap again to confirm"; setTimeout(()=>{resetArmed=false; const r=$("#reset"); if(r) r.textContent="Reset";},3000); return; }
    resetArmed=false; const th=S.theme; S=blank(); S.theme=th; save(); toast("Progress cleared"); render(progress); };
}

/* Android hardware back button (Capacitor) */
document.addEventListener("backbutton", e=>{ e.preventDefault&&e.preventDefault(); if(stack.length>1) back(); });
window.__poeBack = () => { if (stack.length>1){ back(); return true; } return false; };
try {
  const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (App) App.addListener("backButton", () => { if (!window.__poeBack()) App.exitApp(); });
} catch(e){}

go(home);
})();
</script>
